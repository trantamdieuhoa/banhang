<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Bán hàng</title>
<!-- Cài như app trên điện thoại (khi app nằm ở web riêng, VD GitHub Pages) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bán hàng">

<base target="_top">
<style>
/* ── MÀU & KÍCH THƯỚC (sửa ở đây để đổi giao diện) ── */
:root{
  --chinh:#0f766e; --chinh-nhat:#e6f4f1; --chu:#1c1917; --phu:#78716c; --nen:#f5f5f4; --the:#fff;
  --vien:#e7e5e4; --do:#dc2626; --do-nhat:#fef2f2; --vang:#b45309; --vang-nhat:#fffbeb; --xanh:#2563eb;
  --bo:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--nen);color:var(--chu);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* iPHONE/iPAD: app bắt bấm ở cấp trang (document). Safari iOS KHÔNG báo lần chạm vào div/span thường lên trang
   → dòng món (tab Hàng), mục tab Thêm, dòng khách/đơn/NCC chạm không ăn. Có cursor:pointer thì Safari mới coi là "bấm được".
   MỌI phần tử có data-a phải có dòng này (test15 quét toàn app, thiếu là đỏ). */
[data-a]{cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.08)}
.an{display:none!important}

/* Khung chính */
#dau{position:sticky;top:0;z-index:5;background:var(--chinh);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px}
#dau b{font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dau small{opacity:.85;font-size:12px}
#dau .dong-bo{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:20px;padding:4px 10px;font-size:12px}
#noi-dung{padding:12px 12px 140px;max-width:640px;margin:0 auto}
#dieu-huong{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--the);border-top:1px solid var(--vien);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#dieu-huong button{flex:1;border:0;background:none;padding:7px 0 8px;font-size:12px;color:var(--phu);display:flex;flex-direction:column;align-items:center;gap:1px}
#dieu-huong button i{font-style:normal;font-size:20px;line-height:1.1}
#dieu-huong button.chon{color:var(--chinh);font-weight:600}

/* Thành phần dùng chung */
.the{background:var(--the);border:1px solid var(--vien);border-radius:var(--bo);padding:12px;margin-bottom:10px}
.nut{border:1px solid var(--vien);background:var(--the);border-radius:10px;padding:10px 14px;font-weight:500}
.nut.chinh{background:var(--chinh);border-color:var(--chinh);color:#fff}
.nut.do{color:var(--do);border-color:#fecaca}
.nut.nho{padding:6px 10px;font-size:13px}
.nut:disabled{opacity:.5}
.hang-nut{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hang-nut .nut{flex:1 1 auto}
input.o,select.o,textarea.o{width:100%;border:1px solid var(--vien);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input.o:focus,select.o:focus,textarea.o:focus{border-color:var(--chinh);box-shadow:0 0 0 3px var(--chinh-nhat)}
label.nhan{display:block;font-size:13px;color:var(--phu);margin:10px 0 4px}
.goi-y{font-size:12px;color:var(--chinh);min-height:16px;margin-top:2px}
.mo{color:var(--phu);font-size:13px}
.tien{font-variant-numeric:tabular-nums;white-space:nowrap}
.no{color:var(--do);font-weight:600}
.the-nhan{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--nen);color:var(--phu);font-weight:500}
.the-nhan.do{background:var(--do-nhat);color:var(--do)}
.the-nhan.vang{background:var(--vang-nhat);color:var(--vang)}
.the-nhan.xanh{background:var(--chinh-nhat);color:var(--chinh)}
.dong{display:flex;align-items:center;gap:8px}
.dong>.gian{flex:1;min-width:0}
.ds>.muc{padding:11px 2px;border-bottom:1px solid var(--vien)}
.ds>.muc:last-child{border-bottom:0}
.trong{text-align:center;color:var(--phu);padding:30px 10px}
.loc{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.loc button{border:1px solid var(--vien);background:var(--the);border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap}
.loc button.chon{background:var(--chu);border-color:var(--chu);color:#fff}
h3{font-size:15px;margin:4px 0 8px}
.so-lon{font-size:22px;font-weight:700}

/* Bán hàng */
.chon-khach{width:100%;text-align:left;display:flex;align-items:center;gap:8px;border:1px solid var(--vien);background:var(--the);border-radius:var(--bo);padding:10px 12px;margin-bottom:8px}
.chon-khach .gian{flex:1}
.o-tim{position:sticky;top:46px;z-index:4;background:var(--nen);padding:4px 0 8px}
/* Trong bảng trượt lên (#bang) không có thanh tiêu đề app phía trên → ô tìm dính sát mép trên, không che dòng đầu danh sách */
#bang .o-tim{top:0}
.o-tim input{font-size:16px;padding:12px 14px}
/* Tab Hàng (2.9): nút vuông cùng cỡ, danh sách gọn 2 dòng, giá dồn bên phải, chữ cái phân nhóm */
.nut-vuong{min-width:46px;height:46px;padding:0 10px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px;flex:none}
.loc button .dem-loc{opacity:.6;margin-left:4px;font-size:12px}
.chon-dm{width:100%;margin-bottom:8px;font-size:15px;padding:10px 12px}
.ds-hang>.muc{padding:8px 2px}
.ds-hang .ten-hh{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ds-hang .phu-hh{font-size:12.5px;color:var(--phu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gia-hh{flex:none;text-align:right;font-size:12.5px;line-height:1.45;color:var(--phu);max-width:45%}
.gia-hh b{color:var(--chu);font-size:14px;font-weight:700}
.chu-cai{position:sticky;top:104px;z-index:2;background:var(--nen);font-weight:700;font-size:13px;color:var(--chinh);padding:4px 4px;margin:0 -12px;padding-left:14px;border-bottom:1px solid var(--vien)}
.hh{background:var(--the);border:1px solid var(--vien);border-radius:var(--bo);padding:10px 12px;margin-bottom:8px}
.hh-ten{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
a.nut{text-decoration:none;color:inherit}
.don-tam{flex-wrap:nowrap;overflow-x:auto;margin:0 0 8px;padding-bottom:2px}.don-tam .chip{white-space:nowrap;flex:none}
.chip{border:1px solid var(--chinh);color:var(--chinh);background:#fff;border-radius:10px;padding:7px 10px;font-size:14px;position:relative}
.chip b{font-weight:700}
.chip.phu{border-style:dashed;border-color:var(--vien);color:var(--phu)}
.chip.vang{border-color:var(--vang);color:var(--vang)}
.chip .dem{position:absolute;top:-8px;right:-6px;background:var(--chinh);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:700}
.nut-sua{border:0;background:none;color:var(--phu);font-size:16px;padding:0 4px}
#thanh-gio{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:5;background:var(--chu);color:#fff;border:0;border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:620px;margin:0 auto}
#thanh-gio .gian{flex:1;text-align:left}

/* Giỏ hàng */
.dong-gio{padding:10px 0;border-bottom:1px solid var(--vien)}
.buoc{display:flex;align-items:center;border:1px solid var(--vien);border-radius:10px;overflow:hidden}
.buoc button{border:0;background:var(--nen);width:38px;height:38px;font-size:20px}
.buoc input{width:52px;border:0;text-align:center;height:38px;font-weight:600;outline:none}
.gia-sua{border:0;background:none;padding:0;color:var(--xanh);text-decoration:underline dotted;font-size:13px}
.hinh-thuc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.hinh-thuc button{border:1.5px solid var(--vien);background:#fff;border-radius:10px;padding:10px 4px;font-size:14px}
.hinh-thuc button.chon{border-color:var(--chinh);background:var(--chinh-nhat);color:var(--chinh);font-weight:600}
.tong-dong{display:flex;justify-content:space-between;padding:4px 0}
.tong-dong.lon{font-size:19px;font-weight:700;border-top:1px dashed var(--vien);margin-top:6px;padding-top:10px}

/* Bảng trượt từ dưới lên */
/* KHÔNG dùng "inset:0": Safari iPad cũ (< iPadOS 14.5) không hiểu → lớp che co lại góc trái dưới */
#man-che{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#bang{background:var(--nen);width:100%;max-width:640px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
#bang .dau-bang{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--vien);background:var(--the);border-radius:16px 16px 0 0}
#bang .dau-bang b{flex:1;font-size:16px}
#bang .dau-bang button{border:0;background:var(--nen);border-radius:20px;width:34px;height:34px;font-size:16px}
#bang .than-bang{overflow-y:auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}

/* Thông báo */
#thong-bao{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px)}
#thong-bao div{background:var(--chu);color:#fff;padding:11px 14px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:14px}
#thong-bao div.loi{background:var(--do)}
#thong-bao div.tot{background:var(--chinh)}
#thanh-chon{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:5;background:var(--chu);color:#fff;border-radius:14px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:620px;margin:0 auto}
#thanh-chon .hang-nut{margin-top:8px}
#thanh-chon .nut{padding:9px 10px;font-size:14px}
.o-chon{font-size:22px;line-height:1;margin-right:10px}
/* Ảnh: ô nhỏ bấm vào xem to */
.anh-ds{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.anh-nho{width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--vien);display:block;flex:none}
.anh-nho img{width:100%;height:100%;object-fit:cover;display:block}
.nut-anh{border:1px dashed var(--vien);background:none;border-radius:8px;width:64px;height:64px;font-size:20px;color:var(--phu)}
#cho{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
#cho div{background:var(--the);padding:18px 22px;border-radius:14px;font-weight:600}

/* Đăng nhập */
.dang-nhap{max-width:380px;margin:12vh auto 0;padding:0 16px}
.dang-nhap h1{font-size:24px;margin:0 0 4px;color:var(--chinh)}

/* Hoá đơn */
.hd-dong{display:flex;gap:8px;padding:6px 0;border-bottom:1px dotted var(--vien);font-size:14px}
.hd-dong .gian{flex:1}
.qr{display:block;width:100%;max-width:300px;margin:8px auto;border-radius:10px;background:#fff}
.anh-hd{width:100%;border:1px solid var(--vien);border-radius:8px;background:#fff}
.cot{height:8px;background:var(--chinh);border-radius:4px;min-width:2px}
#vung-in{display:none}
@media print{
  @page{margin:2mm}
  body>*:not(#vung-in){display:none!important}
  #vung-in{display:block;width:72mm;font:12px/1.35 Arial,sans-serif;color:#000}
  #vung-in .giua{text-align:center}
  #vung-in table{width:100%;border-collapse:collapse}
  #vung-in td{padding:2px 0;vertical-align:top}
  #vung-in .phai{text-align:right}
  #vung-in hr{border:0;border-top:1px dashed #000}
}
/* Quét mã vạch: camera toàn màn hình, khung ngắm ở giữa */
#quet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:25;background:#000;color:#fff;display:flex;flex-direction:column}
#quet video{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
#quet .quet-khung{position:absolute;left:8%;right:8%;top:32%;height:22%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
#quet .quet-khung::after{content:'';position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ef4444;opacity:.8}
#quet .quet-tren,#quet .quet-duoi{position:relative;z-index:1;padding:12px 14px;background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,0))}
#quet .quet-tren{display:flex;align-items:center;gap:8px;padding-top:calc(12px + env(safe-area-inset-top))}
#quet .quet-tren b{flex:1;font-size:16px}
#quet .quet-duoi{margin-top:auto;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.8));padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#quet .quet-kq{min-height:44px;font-size:15px;line-height:1.35;margin-bottom:8px}
#quet .quet-kq .tot{color:#86efac}#quet .quet-kq .loi{color:#fca5a5}
#quet .nut{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)}
#quet .nut.chinh{background:var(--chinh);border-color:var(--chinh)}
#quet.loe{animation:loe .25s}
@keyframes loe{from{box-shadow:inset 0 0 0 6px #22c55e}to{box-shadow:inset 0 0 0 0 #22c55e}}
</style>
</head>

<script>

   9. CÔNG NỢ & KHÁCH

const BAN = '3.10';
const CFG = {

  duoiEmail: '@cuahang.vn',  // gõ "hoa" khi đăng nhập = hoa@cuahang.vn

  soDonTamToiDa: 8,          // tối đa bao nhiêu đơn đang lên dở cùng lúc
};
// Bản chạy thử trên máy tính: mở app với ?thu=http://localhost:8000

// Link Zalo theo SĐT. Viết '...' (không dùng `...`) vì Apps Script cắt mất phần sau "//" trong chuỗi `...`
const ZALO = 'https:' + '//zalo.me/';
// ── Hồ sơ khách (KH01): ten = tên quán (hoặc tên người), ten_chu = tên thật chủ quán, sdt/sdt2/sdt3, zalo, zalo_link

function zaloKhach(k) {
  if (!k) return '';

  const s = chiSo(k.zalo) || chiSo(k.sdt); return s ? ZALO + s : '';
}
// Chuỗi tìm kiếm: tên quán + tên chủ + 3 số điện thoại + số Zalo + mã
const chuoiTimKhach = k => boDau((k.ten || '') + ' ' + (k.ten_chu || '')) + ' ' + [...sdtKhach(k), chiSo(k.zalo)].join(' ') + ' ' + k.id.toLowerCase();
// Thông tin đầy đủ của khách theo mã (danh sách đã tải trên máy)
const khTheoId = id => (S.khach || []).find(k => k.id === id);
const NGAN_HANG = [
  ['970436','Vietcombank'],['970415','VietinBank'],['970418','BIDV'],['970405','Agribank'],

// Đọc số tiền người dùng gõ: "365" → 365.000 ; "365k" → 365.000 ; "1,5tr" → 1.500.000 ; "1.250.000" → 1.250.000
// Quy ước như sổ cũ: số nhỏ hơn 1000 hiểu là NGHÌN đồng.
function docTien(s) {
  s = String(s == null ? '' : s).trim().toLowerCase();
  if (!s) return 0;
  const tr = /tr|triệu/.test(s), k = /k|nghìn|ngàn/.test(s);
  // Dấu , hoặc . có 1–2 chữ số phía sau ở cuối = phần lẻ ("8,5" "25.5"); còn lại là dấu phân cách nghìn
  let c = s.replace(/[^\d,.]/g, '');
  const le = c.match(/[.,](\d{1,2})$/);
  c = le ? c.slice(0, -le[0].length).replace(/[.,]/g, '') + '.' + le[1] : c.replace(/[.,]/g, '');
  let n = Number(c) || 0;
  if (tr) n = n * 1e6; else if (k || n < 1000) n = n * 1000;
  return Math.round(n);
}
// Đọc số lượng: "1,5" → 1.5
function docSo(s) {
  s = String(s == null ? '' : s).trim();
  if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');   // "1.000" = một nghìn
  return Number(s.replace(',', '.').replace(/[^\d.]/g, '')) || 0;
}

    // Lỗi kỹ thuật từ máy chủ → câu dễ hiểu (chữ "kết nối" để đơn đang lưu tự vào hàng chờ, gửi lại không trùng)

    [/terminating connection|connection (refused|reset|closed)|ECONNRESET|server closed|upstream|Bad Gateway|Service Unavailable|Gateway Time-?out|^Lỗi (máy chủ )?5\d\d/i, 'Máy chủ tạm mất kết nối – thử lại sau ít giây'],
    [/statement timeout|canceling statement/i, 'Máy chủ xử lý quá lâu – thử lại sau ít giây'],
    [/duplicate key|unique constraint/i, 'Dữ liệu này đã có rồi (trùng)'],

}
function datPhien(j) {

            expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: j.user };

}

async function api(duong, opt, daThuLai) {
  opt = opt || {};
  if (!phien) throw new Error('Chưa đăng nhập');
  if (phien.expires_at - 60 < Date.now() / 1000) await lamMoiPhien();
  let r;
  try {
    r = await fetch(CFG.url + '/rest/v1/' + duong, {
      method: opt.method || 'GET',
      headers: Object.assign({ apikey: CFG.key, Authorization: 'Bearer ' + phien.access_token,
                               'Content-Type': 'application/json' }, opt.headers || {}),
      body: opt.body === undefined ? undefined : JSON.stringify(opt.body) });
  } catch (e) { throw new Error(dichLoi('Failed to fetch')); }
  if (r.status === 401 && !daThuLai) { await lamMoiPhien(); return api(duong, opt, true); }
  const txt = await r.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) throw new Error(dichLoi((j && (j.message || j.msg)) || ('Lỗi máy chủ ' + r.status)));
  return j;
}

// ── 3b. ẢNH (Supabase Storage, kho "anh" riêng tư) ───────────────────
// Tải lên:  POST /storage/v1/object/anh/<đường dẫn>       (ảnh đã nén JPEG)
// Xem:      POST /storage/v1/object/sign/anh {paths}       → link có chữ ký, hết hạn sau 1 giờ
// Trong CSDL chỉ lưu đường dẫn, VD "toa/NCC001/2026-10/k3j9x.jpg".
async function tokenConHan() { if (!phien) throw new Error('Chưa đăng nhập'); if (phien.expires_at - 60 < Date.now() / 1000) await lamMoiPhien(); }
// Nén ảnh: cạnh dài tối đa 2000px, JPEG 72% → ảnh 12MP (~3–5MB) còn ~300–500KB, chữ trên toa vẫn đọc rõ
async function nenAnh(f) {
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((ok, loi) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => loi(new Error('Không đọc được ảnh ' + (f.name || ''))); i.src = url; });
    const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const b = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.72));
    if (!b) throw new Error('Không nén được ảnh');
    return b;
  } finally { URL.revokeObjectURL(url); }
}

// ── 5c. QUÉT MÃ VẠCH ─────────────────────────────────────────────────
// Camera iPhone đọc mã vạch (EAN-13 trên lon/chai/gói, ITF-14 trên thùng, Code 128, QR).
// iPhone chưa có sẵn bộ đọc mã → tải thư viện barcode-detector (khoảng 1MB, chỉ tải lần đầu bấm 📷, sau đó máy tự giữ).
// Máy quét cầm tay Bluetooth (loại "gõ như bàn phím") dùng luôn ô Tìm hàng: quét = gõ mã + Enter.
// Bảng ma_vach: 1 mã → 1 món + 1 quy cách (NULL = đơn vị nhỏ nhất). Danh mục tải về máy có sẵn mã (h.mv) → quét không cần mạng.
const BD_URL = 'https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/iife/ponyfill.js';
const BD_SRI = 'sha384-KJVUIUGb4pmfpWXfD8j3y9ARn6KoGC2vPC/wNUX1O1ZkYemh0BsuvsmdEU2+wS7O';   // chống file bị tráo trên CDN
const DANG_MA = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'code_128', 'code_39', 'qr_code'];
let boDocMa = null;
async function layBoDocMa() {
  if (boDocMa) return boDocMa;
  // Android Chrome có sẵn bộ đọc → dùng luôn, khỏi tải thư viện
  if ('BarcodeDetector' in window) {
    try { const co = await BarcodeDetector.getSupportedFormats();
      if (co.includes('ean_13')) return (boDocMa = new BarcodeDetector({ formats: DANG_MA.filter(x => co.includes(x)) })); } catch (e) {}
  }
  if (!window.BarcodeDetectionAPI) await new Promise((ok, loi) => {
    const s = document.createElement('script');
    if (!CFG.thu) { s.integrity = BD_SRI; s.crossOrigin = 'anonymous'; }
    s.src = CFG.thu ? CFG.url + '/lib/ponyfill.js' : BD_URL;
    s.onload = ok; s.onerror = () => loi(new Error('Không tải được bộ đọc mã vạch – kiểm tra mạng rồi thử lại'));
    document.head.appendChild(s);
  });
  const A = window.BarcodeDetectionAPI;
  if (CFG.thu) A.prepareZXingModule({ overrides: { locateFile: (p, dau) => p.endsWith('.wasm') ? CFG.url + '/lib/' + p : dau + p } });
  return (boDocMa = new A.BarcodeDetector({ formats: DANG_MA }));
}
// Tiếng "bíp" khi đọc được mã (iPhone không rung được từ web)
let amThanh = null;
function bip(cao) {
  try { if (!amThanh) amThanh = new (window.AudioContext || window.webkitAudioContext)();
    const o = amThanh.createOscillator(), g = amThanh.createGain(); o.frequency.value = cao ? 1760 : 440; g.gain.value = 0.15;
    o.connect(g); g.connect(amThanh.destination); o.start(); o.stop(amThanh.currentTime + (cao ? 0.08 : 0.25)); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(cao ? 40 : [60, 60, 60]);
}
// Tra mã trong danh mục đã tải về máy. Mã 12 số (UPC-A) và 13 số có số 0 đầu là cùng 1 mã.
function timMa(ma) {
  ma = String(ma || '').trim().toUpperCase(); if (!ma) return null;
  const M = S.mv || {}, r = M[ma] || (/^\d{12}$/.test(ma) && M['0' + ma]) || (/^0\d{12}$/.test(ma) && M[ma.slice(1)]);
  const h = r && timHang(r.id);
  return h ? { h, qc: r.qc, ma } : null;
}
// Giá theo quy cách của mã: NULL = giá đơn vị nhỏ nhất (quy đổi 1)
function giaTheoMa(h, qc) {
  if (!qc) return h.gia.find(g => Number(g.qd) === 1) || null;
  return h.gia.find(g => g.qc.toLowerCase() === qc.toLowerCase()) || null;
}
const tenQcMa = (h, qc) => qc || h.dv;

// Mở camera. xuLy(ma) chạy mỗi lần đọc được mã. lienTuc = quét nhiều món liên tục (bán hàng); không thì đọc 1 mã rồi đóng.
async function moQuet(tieuDe, xuLy, lienTuc) {
  dongQuet();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Máy này không mở được camera trong app – bấm ⌨ Gõ mã');
  const q = S.q = { tieuDe, xuLy, lienTuc, cuoi: {}, ban: false };
  bip(true);   // bấm nút = cho phép phát âm thanh (iPhone bắt buộc)
  const o = document.createElement('div'); o.id = 'quet';
  o.innerHTML = `<video playsinline muted autoplay></video><div class="quet-khung"></div>
    <div class="quet-tren"><b>${esc(tieuDe)}</b><button class="nut nho" data-a="quetDong">✕</button></div>
    <div class="quet-duoi"><div class="quet-kq" id="quet-kq">Đang mở camera…</div>
      <div class="hang-nut"><button class="nut an" data-a="quetDen" id="quet-den">🔦 Đèn</button><button class="nut" data-a="quetGo">⌨ Gõ mã</button>
        <button class="nut chinh" style="flex:2" data-a="quetDong">${lienTuc ? 'Xong' : 'Đóng'}</button></div></div>`;
  document.body.appendChild(o);
  try {
    const [bd, st] = await Promise.all([layBoDocMa(), navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } })]);
    q.boDoc = bd; q.st = st;
  } catch (e) {
    if (S.q === q) dongQuet();
    throw new Error(e && e.name === 'NotAllowedError' ? 'Chưa cho app dùng camera. iPhone: Cài đặt → Safari → Camera → Cho phép, rồi mở lại app'
      : e && e.name === 'NotFoundError' ? 'Không tìm thấy camera' : (e && e.message) || 'Không mở được camera');
  }
  if (S.q !== q) { q.st.getTracks().forEach(t => t.stop()); return; }   // đã bấm đóng trong lúc chờ
  const v = o.querySelector('video'); v.srcObject = q.st; try { await v.play(); } catch (e) {}
  const tr = q.st.getVideoTracks()[0], cap = tr && tr.getCapabilities ? tr.getCapabilities() : {};
  if (cap.torch) $('#quet-den').classList.remove('an');
  hienKqQuet(lienTuc ? 'Đưa mã vạch vào khung. Quét liên tục được nhiều món.' : 'Đưa mã vạch vào khung');
  vongQuet(q, v);
}
async function vongQuet(q, v) {
  while (S.q === q) {
    if (!q.ban && v.readyState >= 2) {
      try { const kq = await q.boDoc.detect(v); const m = kq && kq[0] && String(kq[0].rawValue || '').trim(); if (m) await nhanMa(q, m); }
      catch (e) {}
    }
    await new Promise(r => setTimeout(r, 120));
  }
}
// Cùng 1 mã còn nằm trong khung thì không tính lại. Đưa ra khỏi khung > 1,2 giây rồi quét lại = thêm 1 nữa.
async function nhanMa(q, ma) {
  const bay = Date.now();
  if (q.cuoi.ma === ma && bay - q.cuoi.thay < 1200) { q.cuoi.thay = bay; return; }
  q.cuoi = { ma, thay: bay };
  await chayMa(q, ma);
}
async function chayMa(q, ma) {
  bip(true); const o = $('#quet'); if (o) { o.classList.remove('loe'); void o.offsetWidth; o.classList.add('loe'); }
  if (!q.lienTuc) dongQuet();
  q.ban = true;
  try { await q.xuLy(ma); }
  catch (e) { bip(false); if (S.q === q) hienKqQuet(e.message, 'loi'); else thongBao(e.message, 'loi'); }
  finally { q.ban = false; q.cuoi.thay = Date.now(); }
}
function hienKqQuet(chu, loai) { const o = $('#quet-kq'); if (o) o.innerHTML = `<span class="${loai || ''}">${esc(chu)}</span>`; }
function dongQuet() {
  const q = S.q; S.q = null;
  if (q && q.st) q.st.getTracks().forEach(t => t.stop());
  const o = $('#quet'); if (o) o.remove();
}
// Cần hỏi (gán mã mới…) khi đang quét liên tục: ẩn camera tạm, hỏi xong hiện lại
async function ngoaiQuet(f) {
  const o = $('#quet'); if (o) o.classList.add('an');
  try { return await f(); } finally { const o2 = $('#quet'); if (o2) o2.classList.remove('an'); }
}
HD.quetDong = () => dongQuet();
HD.quetDen = async () => { const q = S.q, tr = q && q.st && q.st.getVideoTracks()[0]; if (!tr) return;
  q.den = !q.den; try { await tr.applyConstraints({ advanced: [{ torch: q.den }] }); } catch (e) { thongBao('Máy không bật được đèn', 'loi'); } };
// Mã mờ, rách, camera không đọc được → gõ số in dưới mã vạch
HD.quetGo = async () => {
  const q = S.q; if (!q || q.ban) return;
  q.ban = true;   // tạm dừng đọc camera trong lúc gõ
  let v; try { v = await ngoaiQuet(() => hoi('Gõ mã vạch', [{ k: 'ma', nhan: 'Dãy số in dưới mã vạch', kieu: 'sdt', goiY: 'VD: 8934588012228' }], 'Xong')); }
  finally { q.ban = false; }
  const ma = v && String(v.ma || '').replace(/\s+/g, '').toUpperCase(); if (!ma || S.q !== q) return;
  await chayMa(q, ma);
};

// Mã chưa gán → hỏi món nào + quy cách nào, lưu lên máy chủ và vào danh mục trên máy. Trả về {h, qc, ma} hoặc null.
async function ganMaMoi(ma, hCo) {
  let h = hCo;
  if (!h) {
    const v = await hoi('Mã mới: ' + ma, [{ k: 'q', nhan: 'Mã này của món nào? Gõ tên hàng', gt: '' }], 'Tìm',
      'Chưa có món nào mang mã này. Gán 1 lần, lần sau quét là ra ngay.');
    if (!v || !v.q) return null;
    const kq = loc(v.q).slice(0, 20);
    if (!kq.length) { thongBao('Không thấy "' + v.q + '" – thêm mặt hàng trước rồi gán mã', 'loi'); return null; }
    const c = kq.length === 1 ? { id: kq[0].id } : await hoi('Chọn món cho mã ' + ma, [{ k: 'id', nhan: 'Món', kieu: 'chon', ds: kq.map(x => [x.id, x.ten]), gt: kq[0].id }], 'Chọn');
    if (!c) return null; h = timHang(c.id);
  }
  const cu = timMa(ma);
  if (cu && cu.h.id !== h.id && !await xacNhan(`Mã ${ma} đang gán cho "${cu.h.ten}". Chuyển sang "${h.ten}"?`, 'Chuyển mã')) return null;
  // Quy cách: đơn vị nhỏ nhất + các quy cách lớn có giá (thùng, lốc…)
  const ds = [['', h.dv + ' (từng ' + h.dv + ')']].concat(h.gia.filter(g => Number(g.qd) !== 1).map(g => [g.qc, g.qc + ' (' + so(g.qd) + ' ' + h.dv + ')']));
  let qc = '';
  if (ds.length > 1) {
    const c = await hoi('Mã ' + ma + ' là của', [{ k: 'qc', nhan: h.ten + ' – quy cách nào?', kieu: 'chon', ds, gt: cu && cu.h.id === h.id ? (cu.qc || '') : '' }], 'Lưu mã',
      'Mã in trên thùng / lốc thường khác mã trên từng lon, chai. Quét mã thùng → bán 1 thùng.');
    if (!c) return null; qc = c.qc;
  }
  const r = await cho('Đang lưu mã…', () => rpc('gan_ma_vach', { p_ma: ma, p_hang_hoa_id: h.id, p_quy_cach: qc || null }));
  // Cập nhật danh mục trên máy ngay (khỏi chờ tải lại)
  S.hang.forEach(x => { if (x.mv) x.mv = x.mv.filter(m => m.m !== r.ma); });
  (h.mv = h.mv || []).push({ m: r.ma, qc: r.qc }); S.mv[r.ma] = { id: h.id, qc: r.qc }; chuanBiHang();
  luu('bh_hang', { hang: S.hang, taiLuc: S.hangLuc });
  thongBao('Đã gán mã cho ' + h.ten + ' – ' + tenQcMa(h, r.qc) + (r.cu_ten ? ' (bỏ khỏi ' + r.cu_ten + ')' : ''), 'tot');
  return { h, qc: r.qc, ma: r.ma };
}

// Tìm: mọi từ gõ vào đều phải có trong tên (không dấu). Tên bắt đầu bằng từ gõ được xếp trước.
function loc(q) {
  const tu = boDau(q).split(/\s+/).filter(Boolean);
  if (!tu.length) return [];
  const kq = S.hang.filter(h => tu.every(t => h._t.includes(t)));
  // Chấm điểm: tên bắt đầu bằng chữ gõ (+4) > mọi từ nằm trong TÊN, không phải danh mục (+2) > có giá (+1)
  const dau = boDau(q.trim());
  const diem = h => { const t = boDau(h.ten); return (t.startsWith(dau) ? 4 : 0) + (tu.every(x => t.includes(x)) ? 2 : 0) + (h.gia.length ? 1 : 0); };
  kq.forEach(h => { h._d = diem(h); });
  kq.sort((a, b) => b._d - a._d);
  return kq.slice(0, 40);
}
function soTrongGio(id, qc) {
  qc = String(qc).toLowerCase();
  const d = S.gio.dong.find(x => x.id === id && (x.goc ? x.goc.qc.toLowerCase() === qc : x.qc.toLowerCase() === qc));
  return d ? (d.goc ? d.sl / d.goc.n : d.sl) : 0;
}
function veMotHang(h) {

}
function veKetQua() {

function ghiGanDay(id) { const g = (doc('bh_gan') || []).filter(x => x !== id); g.unshift(id); luu('bh_gan', g.slice(0, 15)); }

// Quy cách "chục…" → đổi ra đơn vị nhỏ hơn. Trả về {qc, qd, gia, n} hoặc null (giữ nguyên).
//   chục (10 cây, 1.245.000)        → 10 × cây, giá 124.500
//   chục thùng (240 lon, 2.630.000) → 10 × thùng (24 lon), giá 263.000
function doiQC(h, g) {
  const ten = boDau(g.qc).trim();
  const tien_to = CFG.qcQuyDoi.find(t => ten === t || ten.indexOf(t + ' ') === 0);
  if (!tien_to) return null;
  const conLai = g.qc.trim().slice(tien_to.length).trim();          // "" hoặc "thùng"
  const dich = conLai ? h.gia.find(x => x.qc.toLowerCase() === conLai.toLowerCase())
                      : (h.gia.find(x => Number(x.qd) === 1) || { qc: h.dv, qd: 1 });
  if (!dich) return null;
  const n = g.qd / dich.qd, gia = g.g / n;
  if (!(n > 1) || Math.abs(n - Math.round(n)) > 1e-9 || gia !== Math.round(gia)) return null;  // không chia tròn → giữ nguyên
  return { qc: dich.qc, qd: Number(dich.qd), gia, n: Math.round(n) };
}

// Thêm vào giỏ. dong = {id, ten, qc, qd, gia, giaBang (giá theo bảng, null nếu chưa có), sl, luuGia,
//                       goc: {qc:'chục', n:10} nếu dòng này đổi từ quy cách sỉ}
function themVaoGio(h, qc, qd, gia, giaBang, sl, luuGia, goc) {
  const cu = S.gio.dong.find(x => x.id === h.id && x.qc.toLowerCase() === qc.toLowerCase() &&
    (x.goc ? x.goc.qc : '') === (goc ? goc.qc : ''));
  if (cu) cu.sl = +(cu.sl + (sl || 1)).toFixed(3);
  else S.gio.dong.push({ id: h.id, ten: h.ten, qc, qd, gia, giaBang, sl: sl || 1, luuGia: !!luuGia, goc: goc || null });
  luuGio(); ghiGanDay(h.id);
}
HD.them = el => {
  const h = timHang(el.dataset.id); const g = h.gia.find(x => x.qc === el.dataset.qc);
  const doi = doiQC(h, g);
  if (doi) themVaoGio(h, doi.qc, doi.qd, doi.gia, doi.gia, doi.n, false, { qc: g.qc, n: doi.n });
  else themVaoGio(h, g.qc, g.qd, g.g, g.g, 1);
  veKetQua(); veThanhGio();
  if (navigator.vibrate) navigator.vibrate(15);

  veKetQua(); veThanhGio();

};

// Tồn kho viết gọn theo quy cách lớn nhất: 53 hộp (thùng 48) → "1 thùng 5 hộp"
function tonGon(h) {
  if (h.ton <= 0) return 'hết hàng';
  const lon = h.gia.filter(g => g.qd > 1).sort((a, b) => b.qd - a.qd)[0];
  if (!lon || h.ton < lon.qd) return so(h.ton) + ' ' + h.dv;
  const n = Math.floor(h.ton / lon.qd), du = +(h.ton - n * lon.qd).toFixed(3);
  return n + ' ' + lon.qc + (du ? ' ' + so(du) + ' ' + h.dv : '');
}
// Món này trong đơn có vượt tồn kho không? (cộng mọi dòng cùng món, đổi ra đơn vị nhỏ nhất)
function vuotTon(d) {
  const h = timHang(d.id); if (!h || h.ton == null) return null;
  const can = S.gio.dong.filter(x => x.id === d.id).reduce((s, x) => s + x.sl * x.qd, 0);
  return can > h.ton ? h : null;
}
// Giá hiện tại trong bảng giá (đã tải về máy) cho dòng d – để biết bảng giá vừa đổi
function giaHienTai(d) {
  const h = timHang(d.id); if (!h) return null;
  if (d.goc) { const g = h.gia.find(x => x.qc === d.goc.qc); const dd = g && doiQC(h, g); return dd && dd.qc === d.qc ? dd.gia : null; }
  const g = h.gia.find(x => x.qc.toLowerCase() === d.qc.toLowerCase()); return g ? g.g : null;
}
// Kèm nợ cũ trên báo giá / hoá đơn: mỗi máy nhớ riêng, mặc định BẬT
const kemNoCu = () => doc('bh_no_cu') !== false;
HD.batNoCu = el => { luu('bh_no_cu', el.dataset.k === '1'); veBang(); };
const nutNoCu = () => `<div class="chips" style="margin-top:4px"><span class="mo" style="align-self:center">Ghi nợ cũ lên báo giá / hoá đơn:</span>
  <button class="chip${kemNoCu() ? '' : ' phu'}" data-a="batNoCu" data-k="1">${kemNoCu() ? '✓ ' : ''}Có</button>
  <button class="chip${kemNoCu() ? ' phu' : ''}" data-a="batNoCu" data-k="0">${kemNoCu() ? '' : '✓ '}Không</button></div>`;
const noCuGio = () => { const kh = S.gio.kh && S.khach.find(k => k.id === S.gio.kh.id); return kh && kh.con_no > 0 ? Number(kh.con_no) : 0; };

function tinhGio() {
  const tth = S.gio.dong.reduce((s, d) => s + Math.round(d.sl * d.gia), 0);
  const ck = docChietKhau(S.gio.ck, tth);
  // TH01: trừ tiếp hàng khách trả (phần được trừ), thưởng nắp trả ngay bằng tiền, khoản mình nợ khách
  const tra = traUocTinh(S.gio).reduce((s, x) => s + x.tru, 0);
  const thg = (S.gio.thg || []).reduce((s, x) => s + (x.loai === 'tien' && !x.chuaTra ? x.nap * x.giaTri : 0), 0);
  const treo = (S.gio.treo || []).reduce((s, x) => s + Number(x.so_tien), 0);
  const con = Math.max(tth - ck, 0) - tra - thg - treo;
  return { tth, ck, tra, thg, treo, tong: Math.max(con, 0), du: Math.max(-con, 0) };
}
// Chiết khấu: "10" = 10.000đ (như gõ tiền) · "5%" = 5% tiền hàng (làm tròn đến 1.000đ)
function docChietKhau(s, tth) {
  s = String(s == null ? '' : s).trim();
  const pt = s.match(/^(\d+(?:[.,]\d+)?)\s*%$/);
  if (pt) return Math.round(tth * Math.min(Number(pt[1].replace(',', '.')), 100) / 100 / 1000) * 1000;
  return docTien(s);
}

}

HD.copyBaoGia = () => {

let dangLuu = false;
HD.luuDon = async el => {
  if (dangLuu) return;
  const g = S.gio; const t = tinhGio();
  if (g.ht === 'Ghi nợ' && !g.kh && !g.khMoi) return thongBao('Ghi nợ thì phải chọn khách', 'loi');
  // Chiết khấu bằng/lớn hơn tiền hàng → đơn 0đ: gần như chắc gõ nhầm, hỏi lại
  if (t.ck && t.tth && t.ck >= t.tth && !await xacNhan(`Chiết khấu ${tien(t.ck)} ≥ tiền hàng ${tien(t.tth)} → đơn thành 0đ. Vẫn lưu?`, 'Vẫn lưu')) return;
  const kh = g.kh && S.khach.find(k => k.id === g.kh.id);
  if (g.ht === 'Ghi nợ' && kh && kh.han_muc_no > 0 && kh.con_no + t.tong > kh.han_muc_no &&
      !await xacNhan(`${kh.ten} sẽ nợ ${tien(kh.con_no + t.tong)}, vượt hạn mức ${tien(kh.han_muc_no)}. Vẫn ghi nợ?`, 'Vẫn ghi nợ')) return;
  const p = {
    khach_hang_id: g.kh ? g.kh.id : null, khach_moi: g.khMoi, hinh_thuc: g.ht,
    chiet_khau: t.ck, ghi_chu: g.gc, ma_phieu: g.ma, can_giao: canGiao(g),
    // Luôn gửi đúng giá đang hiện trong giỏ = giá đã báo khách.
    // (Bảng giá có đổi trong lúc lên đơn thì giỏ hiện nhãn "Bảng giá vừa đổi" để các cháu tự quyết.)
    items: g.dong.map(d => ({ hang_hoa_id: d.id, quy_cach: d.qc, so_luong: d.sl, so_luong_quy_doi: d.qd,
      don_gia: d.gia, luu_gia: d.luuGia })),
    // TH01: hàng khách trả, nắp đổi thưởng, khoản treo trừ vào đơn (máy chủ tự kiểm tra lại & tính tiền)
    tra_hang: g.tra.map(x => ({ hang_hoa_id: x.id, quy_cach: x.qc, so_luong_quy_doi: x.qd, so_luong: x.sl, don_gia: x.gia,
      ly_do: x.lyDo, hang_tot: x.tot, doi_lay_lai: x.doiLai })),
    doi_thuong: g.thg.map(x => ({ chuong_trinh_id: x.ct, muc: x.muc, so_nap: x.nap, chua_tra: x.chuaTra })),
    tru_treo: g.treo.map(x => x.id),
  };
  // Máy đang báo mất mạng → khỏi thử, cho vào hàng chờ luôn
  if (navigator.onLine === false) return xepDonCho(g, p, t);
  dangLuu = true;
  try {
    const kq = await chay(el, 'Đang lưu…', () => rpc('tao_don_hang', { p }));
    const coGiaMoi = g.dong.some(d => d.luuGia);
    xoaGioDangMo(g); S.bangs = []; veBang();
    if (kq.trung) thongBao('Đơn này đã được lưu từ lần bấm trước (' + kq.id + ') – không tạo thêm đơn. Kiểm tra lại các món.', 'tot');
    else thongBao('Đã lưu đơn ' + kq.id + (S.gios.length > 1 || gioCo() ? ' · còn ' + S.gios.filter(x => gioCo(x)).length + ' đơn đang lên dở' : ''), 'tot');
    // Báo rõ tiền phải trả lại khách / đã trừ nợ cũ / phần chờ chủ kiểm tra
    if (!kq.trung && (kq.tien_tra_lai > 0 || kq.tien_can_tru > 0 || kq.cho_kiem_tra > 0))
      await hoi('Đơn ' + kq.id, [], 'Đã hiểu', [kq.tien_can_tru > 0 ? 'Đã trừ vào nợ cũ: <b>' + tien(kq.tien_can_tru) + '</b>' : '',
        kq.tien_tra_lai > 0 ? '<b class="no">TRẢ LẠI KHÁCH TIỀN MẶT: ' + tien(kq.tien_tra_lai) + '</b>' : '',
        kq.cho_kiem_tra > 0 ? '⏳ ' + kq.cho_kiem_tra + ' dòng trả hàng KHÔNG trừ tiền – chờ chủ kiểm tra rồi báo lại khách' : ''].filter(Boolean).join('<br>'));
    if (kq.khach_hang_id) delete S.treoKh[kq.khach_hang_id];
    taiKhach().catch(() => {});
    if (coGiaMoi) taiHang(true).catch(() => {});
    moDon(kq.id);
  } catch (e) {
    if (/kết nối/.test(e.message)) xepDonCho(g, p, t);
    else if (/^Cần chủ duyệt/.test(e.message)) { dangLuu = false; await xinDuyet(g, t, e.message, el); }
    else thongBao(e.message, 'loi');
  } finally { dangLuu = false; }
};
// ── PQ01: nhân viên thiếu quyền → gửi chủ duyệt từ xa, chờ, chủ đồng ý thì tự lưu lại đúng đơn này ──
async function xinDuyet(g, t, loi, el) {
  const m = loi.match(/^Cần chủ duyệt: (.*) \[(.*)\]$/) || [];
  const can = (m[2] || '').split(',').filter(Boolean);
  // Tóm tắt cho chủ: khách, tổng, các dòng bán khác giá bảng, chiết khấu
  const khac = g.dong.filter(d => { const bg = ((timHang(d.id) || {}).gia || []).find(x => x.qc === d.qc); return bg && bg.g !== d.gia; })
    .map(d => { const bg = (timHang(d.id).gia || []).find(x => x.qc === d.qc); return `${d.ten}: ${so(d.sl)} ${d.qc} × ${so(d.gia)} (bảng ${so(bg.g)})`; });
  const nd = [`Khách: ${tenKhachGio()}`, `Tổng ${tien(t.tong)}` + (g.ht === 'Ghi nợ' ? ' – ghi nợ' : ''), ...khac,
    t.ck ? 'Chiết khấu ' + tien(t.ck) : '', t.tra || t.thg ? 'Trừ trả hàng/thưởng ' + tien(t.tra + t.thg) : ''].filter(Boolean).join('\n');
  if (!await hoi('Cần chủ duyệt', [], '🔔 Gửi chủ duyệt', `Bạn chưa có quyền: <b>${esc(m[1] || '')}</b>.<pre style="white-space:pre-wrap;font-family:inherit">${esc(nd)}</pre>Gửi yêu cầu, chủ đồng ý trên máy chủ là đơn tự lưu.`)) return;

// Chia mỗi dòng trả: phần được trừ tiền (≤ số khách còn được trả) / phần chờ chủ kiểm tra
function traUocTinh(g) {
  const con = {};   // số còn được trả còn lại theo món (nhiều dòng cùng món dùng chung)
  return (g.tra || []).map(x => {
    if (x.doiLai) return { x, tru: 0, cho: 0, doiLai: true };
    if (!(x.id in con)) con[x.id] = x.conDuoc == null ? Infinity : Number(x.conDuoc);   // null = chưa kiểm được (mất mạng)
    const slDuoc = Math.max(0, Math.min(x.sl, Math.floor(con[x.id] / x.qd * 1000) / 1000));
    con[x.id] -= slDuoc * x.qd;
    return { x, tru: Math.round(slDuoc * x.gia), cho: +(x.sl - slDuoc).toFixed(3), slDuoc };
  });
}

function goiAI(goi, ham) {

const AI_TU_BO = new Set(('cho em anh chi lay them nhe nha va voi giao giup minh toi ban oi ak ah cai con nua mua dat gui roi nhanh sang chieu mai hom nay ' +
  'khach quan co ko khong nhieu it gia thung loc goi ket chai lon bich hop kg chuc cay tui hu vi loai nhu tren duoi').split(' '));
function ungVienAI(tin, coAnh) {
  if (coAnh || !tin) return null;
  const doan = boDau(tin).split(/[\n,;+]|\bva\b|\bvoi\b/).map(x => x.trim()).filter(Boolean), chon = new Set();
  doan.forEach(d => {
    const tu = [...new Set(d.split(/[^a-z0-9]+/).filter(t => t.length >= 2 && !/^\d+$/.test(t) && !AI_TU_BO.has(t)))];
    if (!tu.length) return;

    S.hang.forEach(h => { let n = 0; tu.forEach(t => { if (h._t.includes(t)) n++; }); if (n) kq.push([n + (h.gia.length ? 0.1 : 0), h]); });
    kq.sort((a, b) => b[0] - a[0]); kq.slice(0, 20).forEach(x => chon.add(x[1]));
  });

}

async function layDonThang(thang) {
  const [y, m] = thang.split('-').map(Number);
  const dau = thang + '-01T00:00:00+07:00', cuoi = new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 7) + '-01T00:00:00+07:00';
  const ds = []; let tu = 0;
  for (;;) {
    const phan = await api('don_hang?select=id,ngay,hinh_thuc,tong_tien_hang,chiet_khau,tong_cong,ghi_chu,trang_thai,nguoi_tao,' +
      'khach_hang(ten,sdt,dia_chi),don_hang_ct(stt,ten_hang,quy_cach,so_luong,don_gia,giam_gia,thanh_tien),thanh_toan(so_tien)' +
      '&ngay=gte.' + encodeURIComponent(dau) + '&ngay=lt.' + encodeURIComponent(cuoi) + '&order=ngay,id&limit=1000&offset=' + tu);
    ds.push(...phan); if (phan.length < 1000) break; tu += 1000;
  }
  ds.forEach(d => { d.ct = (d.don_hang_ct || []).sort((a, b) => a.stt - b.stt); d.kh = d.khach_hang || {};
    d.da_tra = (d.thanh_toan || []).reduce((s, t) => s + Number(t.so_tien), 0); d.huy = d.trang_thai === 'huy'; });
  return ds;
}

    try { await navigator.share({ files: [f], title: tenFile }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = tenFile;
  document.body.appendChild(a); a.click(); a.remove(); thongBao('Đã tạo ' + tenFile, 'tot');
}

async function taiFontBase64(url) {
  let r; try { r = await fetch(url); } catch (e) { throw new Error('Không tải được font chữ – kiểm tra mạng'); }
  const b = new Uint8Array(await r.arrayBuffer()); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}

function veAIChotSo(ds) {
  if (!ds || !ds.length) return '';

function veAIToaChotSo(ds) {

HD.aiSoGia = () => {

  if (!S.hang.length) return thongBao('Chưa có mặt hàng nào – thêm hàng (hoặc nạp lại danh mục) trước, rồi mới chụp sổ giá', 'loi');
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const kq = await cho('🤖 AI đang đọc ảnh… (10–40 giây)', async () => {
        const blob = await nenAnh(f);
        const anh = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
        await tokenConHan();
        // Danh mục gửi AI: mã|tên|đơn vị|quy cách:giá đang có
        const ds = S.hang.map(h => h.id + '|' + h.ten + '|' + h.dv + '|' + h.gia.map(g => g.qc + ':' + g.g).join(',')).join('\n');

      });

        let gia = Math.round(Number(d.gia) || 0); if (gia > 0 && gia < 1000) gia *= 1000;

        return { goc: d.goc || '', id: h ? h.id : '', qc: cu ? cu.qc : qc, qd: cu ? cu.qd : (Number(d.qd) > 0 ? Number(d.qd) : 1), gia, cu: cu ? cu.g : null,

      });

    } catch (e) { thongBao(e.message, 'loi'); }

  inp.click();
};

  const kq = loc(v.q).slice(0, 15); if (!kq.length) { thongBao('Không thấy "' + v.q + '"', 'loi'); return null; }
  const c = await hoi('Chọn món', [{ k: 'id', nhan: 'Món', kieu: 'chon', ds: kq.map(h => [h.id, h.ten]), gt: kq[0].id }], 'Chọn');
  return c ? c.id : null;
}
HD.sgLuu = el => chay(el, 'Đang lưu…', async () => {
  const ds = S.sg.filter(d => d.chon && d.id && d.gia > 0); let moi = 0, doi = 0;
  const re = ds.filter(d => d.gia < 1000);
  if (re.length && !await xacNhan(re.length + ' giá dưới 1.000đ (VD ' + timHang(re[0].id).ten + ' ' + tien(re[0].gia) + '). Vẫn lưu?', 'Vẫn lưu')) return;
  for (const d of ds) {
    const h = timHang(d.id), cu = h.gia.find(g => boDau(g.qc) === boDau(d.qc));
    if (cu) { await sua('bang_gia', 'hang_hoa_id=eq.' + d.id + '&quy_cach=eq.' + encodeURIComponent(cu.qc) + '&dang_ap_dung=is.true', { gia_ban: d.gia }); doi++; }
    else { await ghi('bang_gia', { hang_hoa_id: d.id, quy_cach: d.qc, so_luong_quy_doi: d.qd || 1, gia_ban: d.gia }); moi++; }
  }
  await taiHang(true);
  thongBao('Đã lưu ' + moi + ' giá mới' + (doi ? ', đổi ' + doi + ' giá' : ''), 'tot');
  S.bangs.pop(); veBang();
});

  moBang(id ? 'Sửa hàng ' + id : 'Thêm mặt hàng', ve); ganNop();

// Xem trước bảng giá: "Xách (5 gói) = 72.000đ → 14.400đ/gói" và cảnh báo giá lệch.
// Lệch = giá 1 đơn vị nhỏ nhất của quy cách lớn ĐẮT HƠN giá lẻ, hoặc RẺ HƠN một nửa giá lẻ
// (thường do gõ thừa / thiếu số 0: 720 = 720.000đ, 7200 = 7.200đ).
function xemGia(dong, dv) {
  dv = (dv || '').trim() || 'đv';
  const ds = dong.filter(g => String(g.qc).trim() && docTien(g.gia) > 0)
    .map(g => ({ qc: String(g.qc).trim(), qd: docSo(g.qd) || 1, gia: docTien(g.gia) }));
  const le = ds.filter(g => g.qd === 1)[0];
  const canhBao = [];
  const html = ds.map(g => {
    const moi = g.gia / g.qd; let lech = '';
    if (le && g.qd > 1 && (moi > le.gia * 1.05 || moi < le.gia * 0.5)) {
      lech = moi > le.gia ? 'đắt hơn giá lẻ' : 'rẻ hơn nửa giá lẻ';
      canhBao.push(`• ${g.qc} ${tien(g.gia)} = ${tien(moi)}/${dv}, ${lech} (${tien(le.gia)})`);
    }
    return `<div${lech ? ' style="color:var(--do);font-weight:600"' : ''}>${esc(g.qc)}${g.qd > 1 ? ` (${so(g.qd)} ${esc(dv)})` : ''} = ${tien(g.gia)}`
      + (g.qd > 1 ? ` → ${tien(moi)}/${esc(dv)}` : '') + (lech ? ` ⚠ ${lech}` : '') + '</div>';
  }).join('');
  return { html: html || 'Gõ giá: 15 = 15.000đ · 72 = 72.000đ · 720 = 720.000đ', canhBao };
}

// ── 9b. TAB HÀNG HOÁ ─────────────────────────────────────────────────
// Danh sách toàn bộ hàng: tìm, lọc theo danh mục / chưa có giá / sắp hết / ngừng bán.
// Bấm 1 món → xem chi tiết: bảng giá, tồn kho, giá vốn (chủ), sửa, kiểm kho, thêm vào đơn.
const LOC_HANG = {
  tat:    ['Tất cả',      null],
  chuagia:['Chưa có giá', h => !h.gia.length],
  coton:  ['⭐ Chủ lực', h => h.ton != null],   // món chủ lực = món theo dõi tồn kho
  saphet: ['Sắp hết',     null],   // lấy từ máy chủ (cần tồn tối thiểu)
  ngung:  ['Ngừng bán',   null],   // hàng ẩn, không có trong danh mục bán
  choduyet: ['⏳ Giá NV nhập', h => !!(S.giaCD && S.giaCD.has(h.id))],   // PQ03: chỉ chủ thấy
};
// PQ03: các món có giá do nhân viên nhập / đổi, chờ chủ duyệt
async function taiGiaChoDuyet() {
  if (!laChu()) return;
  const ds = await api('bang_gia?select=hang_hoa_id&cho_duyet=is.true&dang_ap_dung=is.true').catch(() => null);
  if (ds) S.giaCD = new Set(ds.map(x => x.hang_hoa_id));
}
HD.duyetGia = async el => {

// Danh mục gõ thường ("mì chính") → hiện viết hoa chữ đầu cho đều mắt (không đổi dữ liệu)
const hoaDau = s => s ? s.charAt(0).toLocaleUpperCase('vi') + s.slice(1) : s;
function veHang() {
  const demDm = {}; S.hang.forEach(h => { if (h.dm) demDm[h.dm] = (demDm[h.dm] || 0) + 1; });
  const dms = Object.keys(demDm).sort((a, b) => a.localeCompare(b, 'vi'));
  const soChuLuc = S.hang.filter(h => h.ton != null).length;
  // Số món mỗi bộ lọc (bộ lọc tính được trên máy)
  const demLoc = k => k === 'tat' ? S.hang.length : LOC_HANG[k][1] ? S.hang.filter(LOC_HANG[k][1]).length : null;
  $('#noi-dung').innerHTML = `
    <div class="o-tim dong"><input class="o" id="o-tim-hang" type="search" data-i="timHangTab" placeholder="🔍 Tìm hàng…" value="${esc(S.hTim)}" autocomplete="off">
      ${S.hCheDo ? '' : '<button class="nut nut-vuong" data-a="quetTimHang" title="Quét mã vạch để tìm hàng">📷</button>'}
      ${laChu() ? `<button class="nut nut-vuong${S.hCheDo ? ' chinh' : ''}" data-a="hangCheDoChon">${S.hCheDo ? '✓ Xong' : '☑ Chọn'}</button>
        ${S.hCheDo ? '' : '<button class="nut nut-vuong chinh" data-a="hangMoi" title="Thêm mặt hàng">＋</button>'}` : coQuyen('them_hang') ? '<button class="nut nut-vuong chinh" data-a="hangMoi" title="Thêm mặt hàng">＋</button>' : ''}</div>
    <div class="loc">${Object.entries(LOC_HANG).filter(([k]) => (k !== 'ngung' && k !== 'choduyet') || laChu()).filter(([k]) => k !== 'choduyet' || (S.giaCD && S.giaCD.size)).map(([k, [ten]]) => { const n = demLoc(k);
      return `<button data-a="locHang" data-k="${k}" class="${S.hLoc === k ? 'chon' : ''}">${ten}${n != null && k !== 'tat' ? `<span class="dem-loc">${n}</span>` : ''}</button>`; }).join('')}
      ${soChuLuc && !S.hCheDo && coQuyen('nhap_toa') ? `<button data-a="kkMo">📋 Kiểm kho</button>` : ''}</div>
    ${dms.length ? `<select class="o chon-dm" data-d="dmHangChon">
      <option value="">📂 Mọi danh mục (${S.hang.length})</option>
      ${dms.map(d => `<option value="${esc(d)}" ${S.hDm === d ? 'selected' : ''}>${esc(hoaDau(d))} (${demDm[d]})</option>`).join('')}</select>` : ''}
    <div id="ds-hang"></div>`;
  veDsHang();
}
async function locDsHang() {
  let ds;
  if (S.hLoc === 'ngung') {
    if (!S.hNgung) S.hNgung = (await api('hang_hoa?select=id,ten,don_vi,ton_kho,danh_muc(ten)&dang_ban=eq.false&order=ten'))
      .map(h => ({ id: h.id, ten: h.ten, dv: h.don_vi, dm: h.danh_muc && h.danh_muc.ten, ton: h.ton_kho, gia: [], ngung: true, _t: boDau(h.ten + ' ' + h.id) }));
    ds = S.hNgung;
  } else if (S.hLoc === 'saphet') {
    const r = await api('v_hang_sap_het?select=id,ton_toi_thieu');
    const min = {}; r.forEach(x => min[x.id] = x.ton_toi_thieu);
    ds = S.hang.filter(h => h.id in min).map(h => Object.assign({}, h, { min: min[h.id] }));
  } else ds = LOC_HANG[S.hLoc][1] ? S.hang.filter(LOC_HANG[S.hLoc][1]) : S.hang;
  if (S.hDm) ds = ds.filter(h => h.dm === S.hDm);
  const tu = boDau(S.hTim).split(/\s+/).filter(Boolean);
  if (tu.length) ds = ds.filter(h => tu.every(t => h._t.includes(t)));
  return ds;
}
async function veDsHang() {
  const o = $('#ds-hang'); if (!o) return;
  let ds;
  try { ds = await locDsHang(); } catch (e) { o.innerHTML = `<div class="trong">${esc(e.message)}</div>`; return; }
  if (!$('#ds-hang')) return;
  // Giá dồn bên phải: tối đa 3 quy cách, mỗi dòng 1 giá (gói 6,5k / thùng 170k)
  const giaGon = h => { const g = h.gia.slice(0, 3).map(x => `${esc(x.qc)}${x.qd > 1 ? '<span style="font-size:11px">×' + so(x.qd) + '</span>' : ''} <b>${so(x.g / 1000)}k</b>`);
    if (h.gia.length > 3) g.push('+' + (h.gia.length - 3) + ' giá'); return g.join('<br>'); };
  // Chia nhóm theo chữ cái đầu khi xem cả danh sách (không tìm), giúp lướt nhanh
  const nhomChu = !S.hTim.trim();
  let chuTruoc = '';
  const dong = h => {
    let dau = '';
    if (nhomChu) { const c = (boDau(h.ten).charAt(0) || '#').toUpperCase(); const k = /[A-Z]/.test(c) ? c : '#';
      if (k !== chuTruoc) { chuTruoc = k; dau = `<div class="chu-cai">${k}</div>`; } }
    const phu = [esc(h.dv), h.dm && !S.hDm ? esc(hoaDau(h.dm)) : ''].filter(Boolean).join(' · ');
    return dau + `<div class="muc dong" data-a="${S.hCheDo ? 'chonHang' : 'xemHang'}" data-id="${esc(h.id)}">
      ${S.hCheDo ? `<span class="o-chon">${S.hChon.has(h.id) ? '☑' : '☐'}</span>` : ''}
      <div class="gian"><div class="ten-hh">${esc(h.ten)}</div>
        <div class="phu-hh">${phu}${h.ton != null ? ` · <span class="${h.min != null || h.ton <= 0 ? 'no' : ''}">tồn ${so(h.ton)}${h.min != null ? '/' + so(h.min) : ''}</span>` : ''}</div></div>
      <div class="gia-hh">${h.ngung ? '<span class="the-nhan">ngừng bán</span>' : h.gia.length ? giaGon(h) : '<span class="the-nhan vang">chưa có giá</span>'}</div></div>`;
  };
  o.innerHTML = (S.hLoc === 'chuagia' && ds.length && coQuyen('doi_gia_ban') ? '<button class="nut chinh" style="width:100%;margin-bottom:8px" data-a="hangChuaGia">🏷 Điền giá nhanh – gõ giá, Enter là lưu</button>' : '')
    + `<p class="mo" style="margin:0 0 6px">${ds.length} mặt hàng${S.hDm ? ' · ' + esc(hoaDau(S.hDm)) : ''}</p>
    <div class="the ds ds-hang" style="padding-top:4px">${ds.slice(0, S.hSo).map(dong).join('') || '<div class="trong">Không có mặt hàng nào</div>'}</div>
    ${ds.length > S.hSo ? `<button class="nut" id="them-hang" style="width:100%" data-a="themDongHang">Xem thêm (${ds.length - S.hSo} món)</button>` : ''}
    ${S.hCheDo ? '<div style="height:120px"></div>' : ''}`;
  // Cuộn gần cuối → tự hiện thêm (khỏi bấm "Xem thêm")
  const nut = $('#them-hang');
  if (nut && 'IntersectionObserver' in window) {
    const ob = new IntersectionObserver(e => { if (e[0].isIntersecting) { ob.disconnect(); S.hSo += 100; veDsHang(); } }, { rootMargin: '400px' });
    ob.observe(nut);
  }
  veThanhChon(ds.length);
}

  if (!S.hCheDo || S.tab !== 'hang') { if (o) o.remove(); return; }

function tonTheoQC(h) {

    api('nha_cung_cap?select=*,ncc_hang(tao_luc,hang_hoa(id,ten,don_vi,ton_kho,ton_toi_thieu,dang_ban))&id=eq.' + id),
    api('phieu_nhap?select=id,ngay,tong_tien,so_toa,ghi_chu,anh,nguoi_nhap,phieu_nhap_ct(count)&ncc_id=eq.' + id + '&trang_thai=eq.hoan_tat&order=ngay.desc&limit=40'),
    api('tra_ncc?select=*&ncc_id=eq.' + id + '&order=ngay.desc&limit=40'),
    api('v_cong_no_ncc?id=eq.' + id),
  ]);
  if (!r[0]) throw new Error('Không tìm thấy nhà cung cấp ' + id);
  const n = r[0];
  n.han = (await api('v_ncc_han_no?id=eq.' + id).catch(() => []))[0] || null;

  return n;
}

async function monCoToaMoiHon(id) {
  const ct = await api('phieu_nhap_ct?select=id,hang_hoa_id,ten_hang&phieu_nhap_id=eq.' + encodeURIComponent(id));
  if (!ct.length) return [];
  const cuoi = {}; ct.forEach(c => { cuoi[c.hang_hoa_id] = Math.max(cuoi[c.hang_hoa_id] || 0, c.id); });
  const sau = await api('phieu_nhap_ct?select=id,hang_hoa_id,phieu_nhap!inner(trang_thai)&phieu_nhap.trang_thai=eq.hoan_tat&id=gt.' + Math.min(...ct.map(c => c.id))
    + '&hang_hoa_id=in.(' + Object.keys(cuoi).map(encodeURIComponent).join(',') + ')');
  const co = new Set(sau.filter(x => x.id > cuoi[x.hang_hoa_id] && !ct.some(c => c.id === x.id)).map(x => x.hang_hoa_id));
  return [...new Set(ct.filter(c => co.has(c.hang_hoa_id)).map(c => c.ten_hang))];

// ── 9e. KIỂM KHO HÀNG LOẠT (món chủ lực) ─────────────────────────────
// Gõ tự do: "5t7" / "5 thùng 7" = 5 thùng + 7 lẻ · "3l" = 3 lốc · "127" = 127 đơn vị nhỏ nhất · "2,5" = 2,5 kg…
// Trả về {sl} (tính ra đơn vị nhỏ nhất) hoặc {loi}
function docSoDem(chu, h) {
  const s = boDau(chu).replace(/,/g, '.').replace(/\+/g, ' ').trim();
  if (!s) return null;
  if (!/^(\s*\d+(\.\d+)?\s*[a-z]*\s*)+$/.test(s)) return { loi: 'gõ kiểu 5t7, 5 thùng 7 hoặc 127' };
  const qcs = [{ ten: boDau(h.dv), qd: 1 }].concat(h.gia.map(g => ({ ten: boDau(g.qc), qd: Number(g.qd) })));
  let tong = 0; const re = /(\d+(?:\.\d+)?)\s*([a-z]*)/g; let m;
  while ((m = re.exec(s))) {
    const sl = Number(m[1]), u = m[2]; let qd = 1;
    if (u) {
      let k = qcs.filter(q => q.ten.startsWith(u));
      if ((u === 't' || u === 'th') && k.some(q => q.ten.startsWith('thung'))) k = k.filter(q => q.ten.startsWith('thung'));
      const cacQd = [...new Set(k.map(q => q.qd))];
      if (!cacQd.length) return { loi: '"' + u + '" không phải quy cách của món này (' + qcs.map(q => q.ten).join(', ') + ')' };
      if (cacQd.length > 1) return { loi: '"' + u + '" là ' + k.map(q => q.ten).join(' hay ') + '? gõ rõ hơn' };
      qd = cacQd[0];
    }
    tong += sl * qd;
  }
  return { sl: +tong.toFixed(3) };
}
// 127 lon → "5 thùng 7 lon" cho dễ hình dung
function tonChu(sl, h) {
  const lon = h.gia.filter(g => g.qd > 1).sort((a, b) => b.qd - a.qd)[0];
  if (!lon || sl < lon.qd) return so(sl) + ' ' + h.dv;
  const n = Math.floor(sl / lon.qd), du = +(sl - n * lon.qd).toFixed(3);
  return n + ' ' + lon.qc + (du ? ' ' + so(du) + ' ' + h.dv : '');
}
const LOC_KK = { chua: 'Chưa đếm', cu: 'Lâu chưa đếm', tat: 'Tất cả', het: 'Sắp hết' };

    ${ds.length > 200 ? `<p class="mo">Đang hiện 200/${ds.length} món – gõ tìm để thấy món khác.</p>` : ''}`;

// Dòng xem trước dưới ô: "= 127 lon · khớp ✓" / "thiếu 7 lon (−63.000đ)"
function xemDem(x, go) {
  const r = docSoDem(go, x.h); if (!r) return '';
  if (r.loi) return `<span class="no">⚠ ${esc(r.loi)}</span>`;
  const lech = +(r.sl - x.ton).toFixed(3);
  return '= ' + esc(tonChu(r.sl, x.h)) + ' · ' + (lech === 0 ? '<b>khớp ✓</b>'
    : `<b class="${lech < 0 ? 'no' : ''}" style="${lech > 0 ? 'color:var(--vang)' : ''}">${lech < 0 ? 'thiếu' : 'thừa'} ${so(Math.abs(lech))} ${esc(x.h.dv)}${x.gv ? ' (' + (lech < 0 ? '−' : '+') + tien(Math.abs(lech) * x.gv) + ')' : ''}</b>`);
}

  if (Date.now() - lanKiemBan < 60000) return; lanKiemBan = Date.now();
  try {
    const t = await (await fetch('index.html?ban=' + Date.now(), { cache: 'no-store' })).text();
    const moi = (t.match(/const BAN = '([^']+)'/) || [])[1];
    if (!moi || moi === BAN || document.getElementById('ban-moi')) return;
    const n = document.createElement('button'); n.id = 'ban-moi'; n.type = 'button';
    n.style.cssText = 'position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:60;padding:12px;border:0;border-radius:12px;background:#d9480f;color:#fff;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)';
    n.textContent = '🔄 Có bản mới ' + moi + ' (đang dùng ' + BAN + ') – chạm để cập nhật';
    n.onclick = () => { location.replace(location.pathname + '?v=' + encodeURIComponent(moi) + (location.hash || '')); };
    document.body.appendChild(n);
  } catch (e) { /* mất mạng: lần sau kiểm lại */ }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) kiemBanMoi(); });
setInterval(kiemBanMoi, 10 * 60000);
setTimeout(kiemBanMoi, 3000);
window.__appChay = true;   // dấu hiệu: mã app đã chạy hết (không bị dán thiếu)
khoiDong();
</script>
