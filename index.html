<style>
/* ── MÀU & KÍCH THƯỚC (sửa ở đây để đổi giao diện) ── */
:root{
  --chinh:#0f766e; --chinh-nhat:#e6f4f1; --chu:#1c1917; --phu:#78716c; --nen:#f5f5f4; --the:#fff;
  --vien:#e7e5e4; --do:#dc2626; --do-nhat:#fef2f2; --vang:#b45309; --vang-nhat:#fffbeb; --xanh:#2563eb;
  --bo:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--nen);color:var(--chu);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.an{display:none!important}

/* Khung chính */
#dau{position:sticky;top:0;z-index:5;background:var(--chinh);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px}
#dau b{font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dau small{opacity:.85;font-size:12px}
#dau .dong-bo{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:20px;padding:4px 10px;font-size:12px}
#noi-dung{padding:12px 12px 140px;max-width:640px;margin:0 auto}
#dieu-huong{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--the);border-top:1px solid var(--vien);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#dieu-huong button{flex:1;border:0;background:none;padding:7px 0 8px;font-size:12px;color:var(--phu);display:flex;flex-direction:column;align-items:center;gap:1px}
#dieu-huong button i{font-style:normal;font-size:20px;line-height:1.1}
#dieu-huong button.chon{color:var(--chinh);font-weight:600}

/* Thành phần dùng chung */
.the{background:var(--the);border:1px solid var(--vien);border-radius:var(--bo);padding:12px;margin-bottom:10px}
.nut{border:1px solid var(--vien);background:var(--the);border-radius:10px;padding:10px 14px;font-weight:500}
.nut.chinh{background:var(--chinh);border-color:var(--chinh);color:#fff}
.nut.do{color:var(--do);border-color:#fecaca}
.nut.nho{padding:6px 10px;font-size:13px}
.nut:disabled{opacity:.5}
.hang-nut{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hang-nut .nut{flex:1 1 auto}
input.o,select.o,textarea.o{width:100%;border:1px solid var(--vien);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input.o:focus,select.o:focus,textarea.o:focus{border-color:var(--chinh);box-shadow:0 0 0 3px var(--chinh-nhat)}
label.nhan{display:block;font-size:13px;color:var(--phu);margin:10px 0 4px}
.goi-y{font-size:12px;color:var(--chinh);min-height:16px;margin-top:2px}
.mo{color:var(--phu);font-size:13px}
.tien{font-variant-numeric:tabular-nums;white-space:nowrap}
.no{color:var(--do);font-weight:600}
.the-nhan{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--nen);color:var(--phu);font-weight:500}
.the-nhan.do{background:var(--do-nhat);color:var(--do)}
.the-nhan.vang{background:var(--vang-nhat);color:var(--vang)}
.the-nhan.xanh{background:var(--chinh-nhat);color:var(--chinh)}
.dong{display:flex;align-items:center;gap:8px}
.dong>.gian{flex:1;min-width:0}
.ds>.muc{padding:11px 2px;border-bottom:1px solid var(--vien)}
.ds>.muc:last-child{border-bottom:0}
.trong{text-align:center;color:var(--phu);padding:30px 10px}
.loc{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.loc button{border:1px solid var(--vien);background:var(--the);border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap}
.loc button.chon{background:var(--chu);border-color:var(--chu);color:#fff}
h3{font-size:15px;margin:4px 0 8px}
.so-lon{font-size:22px;font-weight:700}

/* Bán hàng */
.chon-khach{width:100%;text-align:left;display:flex;align-items:center;gap:8px;border:1px solid var(--vien);background:var(--the);border-radius:var(--bo);padding:10px 12px;margin-bottom:8px}
.chon-khach .gian{flex:1}
.o-tim{position:sticky;top:46px;z-index:4;background:var(--nen);padding:4px 0 8px}
.o-tim input{font-size:16px;padding:12px 14px}
.hh{background:var(--the);border:1px solid var(--vien);border-radius:var(--bo);padding:10px 12px;margin-bottom:8px}
.hh-ten{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
a.nut{text-decoration:none;color:inherit}
.don-tam{flex-wrap:nowrap;overflow-x:auto;margin:0 0 8px;padding-bottom:2px}.don-tam .chip{white-space:nowrap;flex:none}
.chip{border:1px solid var(--chinh);color:var(--chinh);background:#fff;border-radius:10px;padding:7px 10px;font-size:14px;position:relative}
.chip b{font-weight:700}
.chip.phu{border-style:dashed;border-color:var(--vien);color:var(--phu)}
.chip.vang{border-color:var(--vang);color:var(--vang)}
.chip .dem{position:absolute;top:-8px;right:-6px;background:var(--chinh);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:700}
.nut-sua{border:0;background:none;color:var(--phu);font-size:16px;padding:0 4px}
#thanh-gio{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:5;background:var(--chu);color:#fff;border:0;border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:620px;margin:0 auto}
#thanh-gio .gian{flex:1;text-align:left}

/* Giỏ hàng */
.dong-gio{padding:10px 0;border-bottom:1px solid var(--vien)}
.buoc{display:flex;align-items:center;border:1px solid var(--vien);border-radius:10px;overflow:hidden}
.buoc button{border:0;background:var(--nen);width:38px;height:38px;font-size:20px}
.buoc input{width:52px;border:0;text-align:center;height:38px;font-weight:600;outline:none}
.gia-sua{border:0;background:none;padding:0;color:var(--xanh);text-decoration:underline dotted;font-size:13px}
.hinh-thuc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.hinh-thuc button{border:1.5px solid var(--vien);background:#fff;border-radius:10px;padding:10px 4px;font-size:14px}
.hinh-thuc button.chon{border-color:var(--chinh);background:var(--chinh-nhat);color:var(--chinh);font-weight:600}
.tong-dong{display:flex;justify-content:space-between;padding:4px 0}
.tong-dong.lon{font-size:19px;font-weight:700;border-top:1px dashed var(--vien);margin-top:6px;padding-top:10px}

/* Bảng trượt từ dưới lên */
#man-che{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#bang{background:var(--nen);width:100%;max-width:640px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
#bang .dau-bang{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--vien);background:var(--the);border-radius:16px 16px 0 0}
#bang .dau-bang b{flex:1;font-size:16px}
#bang .dau-bang button{border:0;background:var(--nen);border-radius:20px;width:34px;height:34px;font-size:16px}
#bang .than-bang{overflow-y:auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}

/* Thông báo */
#thong-bao{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px)}
#thong-bao div{background:var(--chu);color:#fff;padding:11px 14px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:14px}
#thong-bao div.loi{background:var(--do)}
#thong-bao div.tot{background:var(--chinh)}
/* Ảnh: ô nhỏ bấm vào xem to */
.anh-ds{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.anh-nho{width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--vien);display:block;flex:none}
.anh-nho img{width:100%;height:100%;object-fit:cover;display:block}
.nut-anh{border:1px dashed var(--vien);background:none;border-radius:8px;width:64px;height:64px;font-size:20px;color:var(--phu)}
#cho{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
#cho div{background:var(--the);padding:18px 22px;border-radius:14px;font-weight:600}

/* Đăng nhập */
.dang-nhap{max-width:380px;margin:12vh auto 0;padding:0 16px}
.dang-nhap h1{font-size:24px;margin:0 0 4px;color:var(--chinh)}

/* Hoá đơn */
.hd-dong{display:flex;gap:8px;padding:6px 0;border-bottom:1px dotted var(--vien);font-size:14px}
.hd-dong .gian{flex:1}
.qr{display:block;width:100%;max-width:300px;margin:8px auto;border-radius:10px;background:#fff}
.anh-hd{width:100%;border:1px solid var(--vien);border-radius:8px;background:#fff}
.cot{height:8px;background:var(--chinh);border-radius:4px;min-width:2px}
#vung-in{display:none}
@media print{
  @page{margin:2mm}
  body>*:not(#vung-in){display:none!important}
  #vung-in{display:block;width:72mm;font:12px/1.35 Arial,sans-serif;color:#000}
  #vung-in .giua{text-align:center}
  #vung-in table{width:100%;border-collapse:collapse}
  #vung-in td{padding:2px 0;vertical-align:top}
  #vung-in .phai{text-align:right}
  #vung-in hr{border:0;border-top:1px dashed #000}
}
</style>

<script>
'use strict';
/* =====================================================================
   APP BÁN HÀNG – chạy trên Supabase
   Cấu trúc file (tìm theo tiêu đề ── … ──):
   1. CẤU HÌNH           – địa chỉ Supabase, khoá công khai
   2. TIỆN ÍCH           – định dạng tiền, bỏ dấu, lưu máy…
   3. KẾT NỐI SUPABASE   – đăng nhập, gọi API, tự làm mới phiên
   4. DỮ LIỆU            – tải danh mục hàng, khách, cấu hình
   5. KHUNG & ĐIỀU HƯỚNG – vẽ đầu trang, thanh tab, bảng trượt, hộp nhập
   6. TAB BÁN HÀNG       – tìm hàng, giỏ, lưu đơn
   7. ĐƠN HÀNG           – danh sách, chi tiết, thu tiền, huỷ
   8. HOÁ ĐƠN            – chữ để copy, ảnh, in, mã QR
   9. CÔNG NỢ & KHÁCH
  9b. HÀNG HOÁ          – danh sách, lọc, chi tiết, kiểm kho, ngừng bán
  10. THÊM               – cửa hàng, ngân hàng, nhân viên, báo cáo, sửa hàng
  11. KHỞI ĐỘNG
   ===================================================================== */

// ── 1. CẤU HÌNH ──────────────────────────────────────────────────────
const CFG = {
  url: 'https://mrfwdmpdkhnhfblldzba.supabase.co',
  key: 'sb_publishable_92KnloG8NcjLUmpr92s6xw_7yPlsYJ3',  // khoá CÔNG KHAI – để ở đây là an toàn
  duoiEmail: '@cuahang.vn',  // gõ "hoa" khi đăng nhập = hoa@cuahang.vn
  phutLamMoiHang: 10,        // tự tải lại danh mục hàng sau bao nhiêu phút
  // Quy cách chỉ là "mức giá sỉ", khi lên đơn tự đổi ra đơn vị nhỏ hơn:
  //   1 chục Sài gòn (1.245.000) → 10 cây × 124.500 ; 1 chục thùng → 10 thùng.
  // Thêm tên khác (viết không dấu) nếu muốn, VD: ['chuc', 'loc']. Thùng không có ở đây nên vẫn là thùng.
  qcQuyDoi: ['chuc'],
  // Đọc tin nhắn bằng AI: để trống = gọi qua Apps Script đang chạy app (Code.gs, hàm docTinNhan).
  // Nếu đưa app lên Netlify thì dán link /exec của Apps Script vào đây.
  // Mở app ở web riêng (GitHub Pages…) thì gọi AI qua link /exec của Apps Script này.
  // (Mở app bằng chính link /exec thì tự dùng google.script.run, không cần dòng này.)
  urlAI: 'https://script.google.com/macros/s/AKfycbw0lovzA42ktbTWqOuCueemZ_iBKLX-p-H0RAK04pOlqNn9Y4nIWyJaCLrdO6J8yWQNZw/exec',
  soDonTamToiDa: 8,          // tối đa bao nhiêu đơn đang lên dở cùng lúc
};
// Bản chạy thử trên máy tính: mở app với ?thu=http://localhost:8000
(function(){ const m = location.search.match(/[?&]thu=([^&]+)/); if (m) { CFG.url = decodeURIComponent(m[1]); CFG.thu = true; } })();

// Link Zalo theo SĐT. Viết '...' (không dùng `...`) vì Apps Script cắt mất phần sau "//" trong chuỗi `...`
const ZALO = 'https:' + '//zalo.me/';
const NGAN_HANG = [
  ['970436','Vietcombank'],['970415','VietinBank'],['970418','BIDV'],['970405','Agribank'],
  ['970407','Techcombank'],['970422','MB Bank'],['970416','ACB'],['970432','VPBank'],
  ['970403','Sacombank'],['970423','TPBank'],['970441','VIB'],['970448','OCB'],
];
const HT = ['Tiền mặt', 'Chuyển khoản', 'Ghi nợ'];

// ── 2. TIỆN ÍCH ──────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const boDau = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/đ/g, 'd').replace(/Đ/g, 'd').toLowerCase();
const tien = n => Math.round(Number(n) || 0).toLocaleString('vi-VN') + 'đ';
const so = n => Number(n || 0).toLocaleString('vi-VN', { maximumFractionDigits: 3 });
const chiSo = s => String(s || '').replace(/\D/g, '');

// Đọc số tiền người dùng gõ: "365" → 365.000 ; "365k" → 365.000 ; "1,5tr" → 1.500.000 ; "1.250.000" → 1.250.000
// Quy ước như sổ cũ: số nhỏ hơn 1000 hiểu là NGHÌN đồng.
function docTien(s) {
  s = String(s == null ? '' : s).trim().toLowerCase();
  if (!s) return 0;
  const tr = /tr|triệu/.test(s), k = /k|nghìn|ngàn/.test(s);
  // Dấu , hoặc . có 1–2 chữ số phía sau ở cuối = phần lẻ ("8,5" "25.5"); còn lại là dấu phân cách nghìn
  let c = s.replace(/[^\d,.]/g, '');
  const le = c.match(/[.,](\d{1,2})$/);
  c = le ? c.slice(0, -le[0].length).replace(/[.,]/g, '') + '.' + le[1] : c.replace(/[.,]/g, '');
  let n = Number(c) || 0;
  if (tr) n = n * 1e6; else if (k || n < 1000) n = n * 1000;
  return Math.round(n);
}
// Đọc số lượng: "1,5" → 1.5
function docSo(s) {
  s = String(s == null ? '' : s).trim();
  if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');   // "1.000" = một nghìn
  return Number(s.replace(',', '.').replace(/[^\d.]/g, '')) || 0;
}

const luu = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const doc = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const xoa = k => { try { localStorage.removeItem(k); } catch (e) {} };

// Ngày giờ theo giờ VN: "18/10 15:30" và "18/10/2026 15:30"
function phanNgay(iso) {
  const t = new Date(new Date(iso).getTime() + 7 * 3600e3); const h = n => String(n).padStart(2, '0');
  return { d: h(t.getUTCDate()), m: h(t.getUTCMonth() + 1), y: t.getUTCFullYear(), gio: h(t.getUTCHours()) + ':' + h(t.getUTCMinutes()) };
}
const ngayNgan = iso => { const p = phanNgay(iso); return p.d + '/' + p.m; };
const ngayGio = iso => { const p = phanNgay(iso); return p.d + '/' + p.m + ' ' + p.gio; };
const ngayDayDu = iso => { const p = phanNgay(iso); return p.d + '/' + p.m + '/' + p.y + ' ' + p.gio; };
// Ngày hôm nay theo giờ VN dạng 2026-10-18 (cộng thêm d ngày)
function ngayVN(d) { const t = new Date(Date.now() + 7 * 3600e3 + (d || 0) * 864e5); return t.toISOString().slice(0, 10); }
const dauNgay = d => encodeURIComponent(ngayVN(d) + 'T00:00:00+07:00');
const soNgayTruoc = iso => Math.floor((Date.now() - new Date(iso)) / 864e5);

function thongBao(msg, loai) {
  const d = document.createElement('div'); d.className = loai || ''; d.textContent = msg;
  $('#thong-bao').appendChild(d); setTimeout(() => d.remove(), loai === 'loi' ? 5000 : 2500);
}
// Copy chữ: thử cách mới, không được thì cách cũ, vẫn không được thì hiện ra để tự chép
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return thongBao('Đã copy – dán vào Zalo', 'tot'); } catch (e) {}
  const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select(); let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  t.remove();
  if (ok) return thongBao('Đã copy – dán vào Zalo', 'tot');
  moBang('Chép nội dung', () => `<p class="mo">Nhấn giữ vào ô dưới → Chọn tất cả → Sao chép</p><textarea class="o" rows="14">${esc(text)}</textarea>`);
}
function linkQR(soTien, noiDung) {
  const nh = S.cauHinh.ngan_hang || {};
  if (!nh.so_tk) return '';
  // Lưu ý: Apps Script cắt mất phần sau dấu "//" nằm trong chuỗi `...` → địa chỉ web phải viết trong '...'
  return 'https://img.vietqr.io/image/' + nh.bin + '-' + chiSo(nh.so_tk) + '-compact2.png?amount=' + Math.round(soTien) +
    '&addInfo=' + encodeURIComponent(noiDung) + '&accountName=' + encodeURIComponent(nh.ten_tk || '');
}
// Cách in thông tin chuyển khoản trên hoá đơn (In / Ảnh / Copy): mỗi máy nhớ riêng
//   'qr'  = mã QR + số TK   ·   'stk' = chỉ ghi số TK   ·   'khong' = không in gì
const KIEU_TT = { qr: '▣ Mã QR', stk: 'Chỉ số TK', khong: 'Không in' };
const kieuTT = () => { const k = doc('bh_in_tt'); return KIEU_TT[k] ? k : 'qr'; };
const dongCK = noiDung => { const nh = S.cauHinh.ngan_hang || {};
  return nh.so_tk ? `Chuyển khoản: ${nh.ten_ngan_hang || ''} ${nh.so_tk} – ${nh.ten_tk || ''}\nNội dung: ${noiDung}` : ''; };

// ── 3. KẾT NỐI SUPABASE ──────────────────────────────────────────────
// Không dùng thư viện: gọi thẳng API REST của Supabase bằng fetch.
//   Đăng nhập:  POST /auth/v1/token?grant_type=password
//   Gọi hàm:    POST /rest/v1/rpc/<tên hàm>
//   Đọc bảng:   GET  /rest/v1/<bảng>?<bộ lọc>
let phien = doc('bh_phien');   // {access_token, refresh_token, expires_at, user}

function dichLoi(m) {
  m = String(m || '');
  const bang = [
    [/Invalid login credentials/i, 'Sai email hoặc mật khẩu'],
    [/Email not confirmed/i, 'Email chưa xác nhận. Vào Supabase → Authentication → tắt "Confirm email"'],
    [/already registered|already exists/i, 'Email này đã có tài khoản'],
    [/Password should be at least/i, 'Mật khẩu phải từ 6 ký tự'],
    [/Unable to validate email|invalid format/i, 'Email không hợp lệ'],
    [/Failed to fetch|NetworkError|Load failed/i, 'Không kết nối được. Kiểm tra mạng rồi thử lại'],
    [/permission denied/i, 'Bạn không có quyền làm việc này'],
    [/Signups not allowed/i, 'Supabase đang tắt đăng ký – bật lại "Allow new users to sign up"'],
  ];
  for (const [re, vi] of bang) if (re.test(m)) return vi;
  return m;
}
async function goiAuth(duong, body) {
  let r;
  try {
    r = await fetch(CFG.url + '/auth/v1/' + duong, { method: 'POST',
      headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch (e) { throw new Error(dichLoi('Failed to fetch')); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(dichLoi(j.msg || j.error_description || j.message || ('Lỗi ' + r.status)));
  return j;
}
function datPhien(j) {
  phien = { access_token: j.access_token, refresh_token: j.refresh_token,
            expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: j.user };
  luu('bh_phien', phien);
}
let dangLamMoi = null;
async function lamMoiPhien() {
  if (!dangLamMoi) dangLamMoi = (async () => {
    try { datPhien(await goiAuth('token?grant_type=refresh_token', { refresh_token: phien.refresh_token })); }
    catch (e) { if (!/kết nối/.test(e.message)) { dangXuat(); throw new Error('Phiên đăng nhập hết hạn, hãy đăng nhập lại'); } throw e; }
    finally { dangLamMoi = null; }
  })();
  return dangLamMoi;
}
async function api(duong, opt, daThuLai) {
  opt = opt || {};
  if (!phien) throw new Error('Chưa đăng nhập');
  if (phien.expires_at - 60 < Date.now() / 1000) await lamMoiPhien();
  let r;
  try {
    r = await fetch(CFG.url + '/rest/v1/' + duong, {
      method: opt.method || 'GET',
      headers: Object.assign({ apikey: CFG.key, Authorization: 'Bearer ' + phien.access_token,
                               'Content-Type': 'application/json' }, opt.headers || {}),
      body: opt.body === undefined ? undefined : JSON.stringify(opt.body) });
  } catch (e) { throw new Error(dichLoi('Failed to fetch')); }
  if (r.status === 401 && !daThuLai) { await lamMoiPhien(); return api(duong, opt, true); }
  const txt = await r.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) throw new Error(dichLoi((j && (j.message || j.msg)) || ('Lỗi máy chủ ' + r.status)));
  return j;
}
const rpc = (ham, thamSo) => api('rpc/' + ham, { method: 'POST', body: thamSo || {} });
const ghi = (bang, du_lieu) => api(bang, { method: 'POST', body: du_lieu, headers: { Prefer: 'return=representation' } });
const sua = (bang, loc, du_lieu) => api(bang + '?' + loc, { method: 'PATCH', body: du_lieu, headers: { Prefer: 'return=representation' } });

// ── 3b. ẢNH (Supabase Storage, kho "anh" riêng tư) ───────────────────
// Tải lên:  POST /storage/v1/object/anh/<đường dẫn>       (ảnh đã nén JPEG)
// Xem:      POST /storage/v1/object/sign/anh {paths}       → link có chữ ký, hết hạn sau 1 giờ
// Trong CSDL chỉ lưu đường dẫn, VD "toa/NCC001/2026-10/k3j9x.jpg".
async function tokenConHan() { if (!phien) throw new Error('Chưa đăng nhập'); if (phien.expires_at - 60 < Date.now() / 1000) await lamMoiPhien(); }
// Nén ảnh: cạnh dài tối đa 2000px, JPEG 72% → ảnh 12MP (~3–5MB) còn ~300–500KB, chữ trên toa vẫn đọc rõ
async function nenAnh(f) {
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((ok, loi) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => loi(new Error('Không đọc được ảnh ' + (f.name || ''))); i.src = url; });
    const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const b = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.72));
    if (!b) throw new Error('Không nén được ảnh');
    return b;
  } finally { URL.revokeObjectURL(url); }
}
// Tải 1 ảnh lên thư mục (VD "toa/NCC001") → trả về đường dẫn để lưu vào CSDL
async function taiAnhLen(f, thuMuc) {
  const blob = await nenAnh(f); await tokenConHan();
  const duong = thuMuc + '/' + ngayVN(0).slice(0, 7) + '/' + maPhieu() + '.jpg';
  let r;
  try {
    r = await fetch(CFG.url + '/storage/v1/object/anh/' + duong, { method: 'POST', body: blob,
      headers: { apikey: CFG.key, Authorization: 'Bearer ' + phien.access_token, 'Content-Type': 'image/jpeg', 'x-upsert': 'false' } });
  } catch (e) { throw new Error('Mất mạng khi tải ảnh lên – thử lại'); }
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error('Không tải được ảnh: ' + dichLoi(j.message || j.error || r.status)
    + (/Bucket not found/i.test(j.message || j.error || '') ? ' (chưa chạy file 05_anh_toa.sql)' : '')); }
  return duong;
}
async function taiNhieuAnh(ds, thuMuc) { const kq = []; for (const f of ds || []) kq.push(await taiAnhLen(f, thuMuc)); return kq; }
// Màn che "Đang tải ảnh…" (dùng khi hộp hỏi đã đóng mà việc vẫn đang chạy)
async function cho(chu, viec) {
  const d = document.createElement('div'); d.id = 'cho'; d.innerHTML = '<div>' + esc(chu) + '</div>'; document.body.appendChild(d);
  try { return await viec(); } finally { d.remove(); }
}
// Ô ảnh nhỏ (link + ảnh được gắn sau bởi napAnh)
const veAnh = ds => (ds && ds.length) ? `<div class="anh-ds">${ds.map(p => `<a class="anh-nho" data-anh="${esc(p)}" target="_blank" rel="noopener"><img alt=""></a>`).join('')}</div>` : '';
const LINK_ANH = {};   // đường dẫn → {url, het} (giữ 50 phút khỏi xin lại)
async function napAnh() {
  const o = [...document.querySelectorAll('a[data-anh]:not([href])')]; if (!o.length) return;
  const can = [...new Set(o.map(a => a.dataset.anh))].filter(p => !(LINK_ANH[p] && LINK_ANH[p].het > Date.now()));
  if (can.length) {
    try {
      await tokenConHan();
      const r = await fetch(CFG.url + '/storage/v1/object/sign/anh', { method: 'POST',
        headers: { apikey: CFG.key, Authorization: 'Bearer ' + phien.access_token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ expiresIn: 3600, paths: can }) });
      const j = await r.json();
      (Array.isArray(j) ? j : []).forEach(x => { if (x.signedURL) LINK_ANH[x.path] = { url: CFG.url + '/storage/v1' + x.signedURL, het: Date.now() + 50 * 60e3 }; });
    } catch (e) { return; }
  }
  document.querySelectorAll('a[data-anh]:not([href])').forEach(a => { const l = LINK_ANH[a.dataset.anh];
    if (l) { a.href = l.url; a.querySelector('img').src = l.url; } });
}

function hoi(tieuDe, o, chuNut, ghiChu) {

        if (f.kieu === 'anh') return `<label class="nhan">${esc(f.nhan)}</label>
          <label class="nut" style="display:block;text-align:center">📷 Chụp / chọn ảnh<input type="file" id="${id}" accept="image/*" multiple data-d="chonAnh" style="display:none"></label>
          <div class="anh-ds" id="${id}_xem"></div>`;
        if (f.kieu === 'ngay') return `<label class="nhan" for="${id}">${esc(f.nhan)}</label><input class="o" type="date" id="${id}" value="${esc(gt)}">`;
        let o2;
        if (f.kieu === 'chon') o2 = `<select class="o" id="${id}">${f.ds.map(x => { const [v, t] = Array.isArray(x) ? x : [x, x];
          return `<option value="${esc(v)}" ${String(v) === String(gt) ? 'selected' : ''}>${esc(t)}</option>`; }).join('')}</select>`;
        else if (f.kieu === 'chu') o2 = `<textarea class="o" id="${id}" rows="3">${esc(gt)}</textarea>`;
        else o2 = `<input class="o" id="${id}" value="${esc(gt)}" ${f.list ? `list="dl_${f.k}"` : ''}
          ${f.kieu === 'tien' || f.kieu === 'so' ? 'inputmode="decimal"' : f.kieu === 'sdt' ? 'inputmode="tel"' : ''}
          ${f.kieu === 'matkhau' ? 'type="password"' : f.kieu === 'email' ? 'type="email"' : ''}
          ${f.kieu === 'tien' ? 'data-i="xemTien"' : ''} placeholder="${esc(f.goiY || '')}" autocomplete="off">
          ${f.list ? `<datalist id="dl_${f.k}">${f.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}
          ${f.kieu === 'tien' ? `<div class="goi-y">${gt ? '= ' + tien(docTien(gt)) : 'Gõ 365 hoặc 365k = 365.000đ'}</div>` : ''}`;
        return `<label class="nhan" for="${id}">${esc(f.nhan)}</label>${o2}`;
      }).join('')}
      <div class="hang-nut"><button type="button" class="nut" data-a="dongBang">Huỷ</button>
        <button class="nut chinh" type="submit">${esc(chuNut || 'Đồng ý')}</button></div></form>`,
      () => ket(null));
    const form = $('#hop-hoi');
    const dau = form.querySelector('input:not([type=checkbox]):not([type=file]):not([type=date]),select'); if (dau) setTimeout(() => dau.focus(), 50);
    form.onsubmit = ev => {

      ket(v); S.bangs.pop(); veBang();
    };

}

// Tìm: mọi từ gõ vào đều phải có trong tên (không dấu). Tên bắt đầu bằng từ gõ được xếp trước.
function loc(q) {
  const tu = boDau(q).split(/\s+/).filter(Boolean);
  if (!tu.length) return [];
  const kq = S.hang.filter(h => tu.every(t => h._t.includes(t)));
  // Chấm điểm: tên bắt đầu bằng chữ gõ (+4) > mọi từ nằm trong TÊN, không phải danh mục (+2) > có giá (+1)
  const dau = boDau(q.trim());
  const diem = h => { const t = boDau(h.ten); return (t.startsWith(dau) ? 4 : 0) + (tu.every(x => t.includes(x)) ? 2 : 0) + (h.gia.length ? 1 : 0); };
  kq.forEach(h => { h._d = diem(h); });
  kq.sort((a, b) => b._d - a._d);
  return kq.slice(0, 40);
}
function soTrongGio(id, qc) {
  qc = String(qc).toLowerCase();
  const d = S.gio.dong.find(x => x.id === id && (x.goc ? x.goc.qc.toLowerCase() === qc : x.qc.toLowerCase() === qc));
  return d ? (d.goc ? d.sl / d.goc.n : d.sl) : 0;
}

// Quy cách "chục…" → đổi ra đơn vị nhỏ hơn. Trả về {qc, qd, gia, n} hoặc null (giữ nguyên).
//   chục (10 cây, 1.245.000)        → 10 × cây, giá 124.500
//   chục thùng (240 lon, 2.630.000) → 10 × thùng (24 lon), giá 263.000
function doiQC(h, g) {
  const ten = boDau(g.qc).trim();
  const tien_to = CFG.qcQuyDoi.find(t => ten === t || ten.indexOf(t + ' ') === 0);
  if (!tien_to) return null;
  const conLai = g.qc.trim().slice(tien_to.length).trim();          // "" hoặc "thùng"
  const dich = conLai ? h.gia.find(x => x.qc.toLowerCase() === conLai.toLowerCase())
                      : (h.gia.find(x => Number(x.qd) === 1) || { qc: h.dv, qd: 1 });
  if (!dich) return null;
  const n = g.qd / dich.qd, gia = g.g / n;
  if (!(n > 1) || Math.abs(n - Math.round(n)) > 1e-9 || gia !== Math.round(gia)) return null;  // không chia tròn → giữ nguyên
  return { qc: dich.qc, qd: Number(dich.qd), gia, n: Math.round(n) };
}

// Thêm vào giỏ. dong = {id, ten, qc, qd, gia, giaBang (giá theo bảng, null nếu chưa có), sl, luuGia,
//                       goc: {qc:'chục', n:10} nếu dòng này đổi từ quy cách sỉ}
function themVaoGio(h, qc, qd, gia, giaBang, sl, luuGia, goc) {
  const cu = S.gio.dong.find(x => x.id === h.id && x.qc.toLowerCase() === qc.toLowerCase() &&
    (x.goc ? x.goc.qc : '') === (goc ? goc.qc : ''));
  if (cu) cu.sl = +(cu.sl + (sl || 1)).toFixed(3);
  else S.gio.dong.push({ id: h.id, ten: h.ten, qc, qd, gia, giaBang, sl: sl || 1, luuGia: !!luuGia, goc: goc || null });
  luuGio(); ghiGanDay(h.id);
}
HD.them = el => {
  const h = timHang(el.dataset.id); const g = h.gia.find(x => x.qc === el.dataset.qc);
  const doi = doiQC(h, g);
  if (doi) themVaoGio(h, doi.qc, doi.qd, doi.gia, doi.gia, doi.n, false, { qc: g.qc, n: doi.n });
  else themVaoGio(h, g.qc, g.qd, g.g, g.g, 1);

// Tồn kho viết gọn theo quy cách lớn nhất: 53 hộp (thùng 48) → "1 thùng 5 hộp"
function tonGon(h) {
  if (h.ton <= 0) return 'hết hàng';
  const lon = h.gia.filter(g => g.qd > 1).sort((a, b) => b.qd - a.qd)[0];
  if (!lon || h.ton < lon.qd) return so(h.ton) + ' ' + h.dv;
  const n = Math.floor(h.ton / lon.qd), du = +(h.ton - n * lon.qd).toFixed(3);
  return n + ' ' + lon.qc + (du ? ' ' + so(du) + ' ' + h.dv : '');
}
// Món này trong đơn có vượt tồn kho không? (cộng mọi dòng cùng món, đổi ra đơn vị nhỏ nhất)
function vuotTon(d) {
  const h = timHang(d.id); if (!h || h.ton == null) return null;
  const can = S.gio.dong.filter(x => x.id === d.id).reduce((s, x) => s + x.sl * x.qd, 0);
  return can > h.ton ? h : null;
}
// Giá hiện tại trong bảng giá (đã tải về máy) cho dòng d – để biết bảng giá vừa đổi
function giaHienTai(d) {
  const h = timHang(d.id); if (!h) return null;
  if (d.goc) { const g = h.gia.find(x => x.qc === d.goc.qc); const dd = g && doiQC(h, g); return dd && dd.qc === d.qc ? dd.gia : null; }
  const g = h.gia.find(x => x.qc.toLowerCase() === d.qc.toLowerCase()); return g ? g.g : null;
}

function veDongAI(d, i) {
  const h = d.id && timHang(d.id);

  const ids = [...new Set([d.id, ...(d.khac || []), ...(d.them || [])].filter(x => x && timHang(x)))];

    ${ids.length ? `<select class="o" style="margin-top:6px" data-d="aiHang" data-idx="${i}">${ids.map(x => `<option value="${x}" ${x === d.id ? 'selected' : ''}>${esc(timHang(x).ten)}</option>`).join('')}</select>`

    <div class="dong" style="margin-top:6px;gap:6px">
      ${h ? (h.gia.length ? `<select class="o" style="flex:2" data-d="aiQC" data-idx="${i}">${h.gia.map(g => `<option value="${esc(g.qc)}" ${g.qc === d.qc ? 'selected' : ''}>${esc(g.qc)} · ${tien(g.g)}</option>`).join('')}</select>`

      <input class="o" style="flex:1;text-align:center" inputmode="decimal" value="${so(d.sl)}" data-d="aiSL" data-idx="${i}">
      <button class="nut nho" data-a="aiTim" data-i="${i}">🔍</button></div></div>`;
}

// Quy cách AI đưa phải có trong bảng giá của món; không có thì lấy quy cách đầu tiên
function qcHopLe(h, qc) {
  if (!h || !h.gia.length) return '';
  const g = h.gia.find(x => boDau(x.qc) === boDau(qc || ''));
  return g ? g.qc : (h.gia.find(x => Number(x.qd) === 1) || h.gia[0]).qc;

  if (!c) return;
  d.them = [c.id, ...(d.them || [])]; d.id = c.id; d.qc = qcHopLe(timHang(c.id), d.qc); d.chac = 1; d.chon = true; veBang();

// Gọi AI: chạy trong Apps Script thì dùng google.script.run; còn lại gọi link /exec (hoặc máy giả lập khi chạy thử)
function goiAI(goi) {
  const gs = window.google && google.script && google.script.run;
  if (gs) return new Promise((ok, loi) => gs.withSuccessHandler(ok).withFailureHandler(e => loi(new Error((e && e.message) || String(e)))).docTinNhan(goi));
  const url = CFG.thu ? CFG.url + '/ai' : CFG.urlAI;
  if (!url) return Promise.reject(new Error('Đọc tin nhắn bằng AI chỉ chạy khi mở app bằng link Apps Script (/exec)'));
  // Gửi dạng text/plain để không bị trình duyệt chặn (CORS)
  return fetch(url, { method: 'POST', body: JSON.stringify(goi) }).then(r => r.json())
    .then(j => { if (j.loi) throw new Error(j.loi); return j; }, e => { throw new Error(e.message && /JSON/.test(e.message) ? 'Apps Script trả về lỗi' : dichLoi('Failed to fetch')); });
}

  if (phien.expires_at - 120 < Date.now() / 1000) await lamMoiPhien();   // Apps Script cần token còn hạn để kiểm tra
  // Danh mục gửi cho AI: mã|tên|các quy cách có giá
  const ds = S.hang.map(h => h.id + '|' + h.ten + '|' + (h.gia.map(g => g.qc).join(',') || h.dv)).join('\n');
  const kq = await chay(el, '🤖 Đang đọc… (5–15 giây)', () => goiAI({ token: phien.access_token, tin, ds }));
  const a = S.ai;
  a.dong = (kq.dong || []).map(d => {

    return { goc: d.goc || '', id: h ? h.id : '', qc: qcHopLe(h, d.qc), sl: Number(d.sl) > 0 ? Number(d.sl) : 1,
             chac: h ? Number(d.chac) || 0 : 0, khac: (d.khac || []).filter(x => x !== d.id && timHang(x)), chon: !!h };

  const ten = (kq.ten_khach || '').trim(); a.kh = null;
  if (ten) {
    const q = boDau(ten), ds2 = S.khach.filter(k => !k.khoa && k.id !== 'KHLE' && boDau(k.ten) === q);
    const ds3 = ds2.length ? ds2 : S.khach.filter(k => !k.khoa && k.id !== 'KHLE' && (boDau(k.ten).includes(q) || q.includes(boDau(k.ten))));
    a.kh = ds3.length === 1 ? { id: ds3[0].id, ten: ds3[0].ten, sdt: ds3[0].sdt, chon: true } : { id: null, ten, chon: false };
  }
  if (!a.dong.length) { a.dong = null; return thongBao('AI không thấy món hàng nào trong tin nhắn', 'loi'); }
  veBang();
};
HD.aiThem = () => {

async function layDon(id) {
  const [d, ct, tt] = await Promise.all([
    api('v_don_hang?select=*&id=eq.' + id),
    api('don_hang_ct?select=*&don_hang_id=eq.' + id + '&order=stt'),
    api('thanh_toan?select=*&don_hang_id=eq.' + id + '&order=ngay'),
  ]);
  if (!d[0]) throw new Error('Không tìm thấy đơn ' + id);
  // Nợ cũ = các đơn KHÁC của khách này còn nợ (tính tại lúc xem)
  const khac = d[0].khach_hang_id === 'KHLE' ? [] :
    await api('v_don_hang?select=con_no&khach_hang_id=eq.' + d[0].khach_hang_id + '&con_no=gt.0&id=neq.' + id);
  return { d: d[0], ct, tt, noCu: khac.reduce((s, x) => s + Number(x.con_no), 0) };
}
async function moDon(id) {
  const x = await layDon(id);
  // Đóng đơn mà bên dưới là trang khách → tải lại khách (số nợ có thể đã đổi)
  moBang('Đơn ' + id, () => veChiTietDon(x), () => { const t = S.bangs[S.bangs.length - 1]; if (t && t.kx) taiLaiKhach().catch(() => {}); });
  S.bangs[S.bangs.length - 1].x = x;
}
async function taiLaiDon() {
  const b = S.bangs[S.bangs.length - 1]; const x = await layDon(b.x.d.id);
  b.x = x; b.ve = () => veChiTietDon(x); veBang();
  if (S.tab === 'don') veDon(); taiKhach().then(() => { if (S.tab === 'khach') veKhach(); }).catch(() => {});
}

// Vẽ hoá đơn ra ảnh (canvas) – rộng 576 điểm = vừa khổ giấy in nhiệt 80mm
async function veAnhHoaDon(x, khongQR) {
  const { d, ct } = x; const shop = S.cauHinh.cua_hang || {};
  const W = 576, P = 24, c = document.createElement('canvas'), g = c.getContext('2d');
  const F = (s, dam) => (dam ? 'bold ' : '') + s + 'px system-ui, Arial, sans-serif';
  // Xuống dòng chữ dài
  const chia = (t, rong, font) => { g.font = font; const tu = String(t).split(' '); const ra = []; let d0 = '';
    tu.forEach(w => { const thu = d0 ? d0 + ' ' + w : w; if (g.measureText(thu).width > rong && d0) { ra.push(d0); d0 = w; } else d0 = thu; });
    ra.push(d0); return ra; };
  const ops = []; let y = P;  // ghi lệnh vẽ trước để biết chiều cao, rồi mới vẽ
  const viet = (t, font, canh, cao, mau) => { const yy = y + cao * 0.8; ops.push(() => { g.font = font; g.textAlign = canh || 'left'; g.fillStyle = mau || '#000';
      g.fillText(t, canh === 'center' ? W / 2 : canh === 'right' ? W - P : P, yy); }); y += cao; };
  const ke = () => { const yy = y + 8; ops.push(() => { g.strokeStyle = '#999'; g.setLineDash([6, 4]); g.beginPath(); g.moveTo(P, yy); g.lineTo(W - P, yy); g.stroke(); }); y += 16; };
  const hai = (trai, phai, font, cao) => { const yy = y + cao * 0.8; ops.push(() => { g.font = font; g.fillStyle = '#000'; g.textAlign = 'left'; g.fillText(trai, P, yy);
      g.textAlign = 'right'; g.fillText(phai, W - P, yy); }); y += cao; };

  chia(shop.ten || 'HOÁ ĐƠN BÁN HÀNG', W - 2 * P, F(30, 1)).forEach(t => viet(t, F(30, 1), 'center', 38));
  if (shop.dia_chi) chia(shop.dia_chi, W - 2 * P, F(19)).forEach(t => viet(t, F(19), 'center', 25, '#333'));
  if (shop.sdt) viet('ĐT: ' + shop.sdt, F(19), 'center', 25, '#333');
  y += 6; viet('HOÁ ĐƠN ' + d.id, F(24, 1), 'center', 32); viet(ngayDayDu(d.ngay), F(19), 'center', 26, '#333');
  ke(); viet('Khách: ' + d.ten_khach + (d.sdt_khach ? ' – ' + d.sdt_khach : ''), F(21, 1), 'left', 30); ke();
  ct.forEach((r, i) => {
    chia((i + 1) + '. ' + r.ten_hang, W - 2 * P, F(21, 1)).forEach(t => viet(t, F(21, 1), 'left', 28));
    hai('    ' + so(r.so_luong) + ' ' + r.quy_cach + ' × ' + so(r.don_gia - r.giam_gia), so(r.thanh_tien), F(21), 30);
  });
  ke();
  if (Number(d.chiet_khau)) { hai('Tiền hàng', tien(d.tong_tien_hang), F(21), 30); hai('Chiết khấu', '−' + tien(d.chiet_khau), F(21), 30); }
  hai('TỔNG CỘNG', tien(d.tong_cong), F(27, 1), 40);
  if (Number(d.da_tra) > 0) hai('Đã trả', tien(d.da_tra), F(21), 30);
  const no = d.trang_thai === 'huy' ? 0 : Number(d.con_no);
  if (no > 0) hai('CÒN LẠI', tien(no), F(23, 1), 34);
  const nc = noCuIn(x);
  if (nc) { hai('Nợ cũ', tien(nc), F(21), 30); hai('TỔNG PHẢI TRẢ', tien(nc + no), F(24, 1), 36); }
  // Mã QR (nếu tải được ảnh – cần máy chủ VietQR cho phép)
  const kieu = kieuTT();
  let anhQR = null; const lq = no > 0 && kieu === 'qr' && !khongQR ? linkQR(no, d.id) : '';
  if (lq) anhQR = await new Promise(ok => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = () => ok(null); i.src = lq; setTimeout(() => ok(null), 6000); });
  if (anhQR) { const yy = y + 10, s = 300; ops.push(() => g.drawImage(anhQR, (W - s) / 2, yy, s, s * anhQR.height / anhQR.width)); y += 10 + s * anhQR.height / anhQR.width + 6;
    viet('Nội dung CK: ' + d.id, F(19), 'center', 26); }
  else if (no > 0 && kieu !== 'khong' && (S.cauHinh.ngan_hang || {}).so_tk) { const nh = S.cauHinh.ngan_hang; ke();
    viet(nh.ten_ngan_hang + ' ' + nh.so_tk, F(21, 1), 'center', 30); viet(nh.ten_tk || '', F(19), 'center', 26); viet('Nội dung CK: ' + d.id, F(19), 'center', 26); }
  ke(); viet('Cảm ơn quý khách!', F(21), 'center', 30);
  if (d.trang_thai === 'huy') viet('*** ĐƠN ĐÃ HUỶ ***', F(24, 1), 'center', 34, '#c00');
  c.width = W; c.height = y + P; g.fillStyle = '#fff'; g.fillRect(0, 0, W, c.height);
  ops.forEach(f => f());
  try { return c.toDataURL('image/png'); }
  catch (e) { return null; }   // ảnh QR làm "bẩn" canvas → vẽ lại không QR
}

const LOC_HANG = {
  tat:    ['Tất cả',      null],
  chuagia:['Chưa có giá', h => !h.gia.length],
  coton:  ['Theo dõi tồn', h => h.ton != null],
  saphet: ['Sắp hết',     null],   // lấy từ máy chủ (cần tồn tối thiểu)

function veHang() {

async function locDsHang() {
  let ds;
  if (S.hLoc === 'ngung') {
    if (!S.hNgung) S.hNgung = (await api('hang_hoa?select=id,ten,don_vi,ton_kho,danh_muc(ten)&dang_ban=eq.false&order=ten'))
      .map(h => ({ id: h.id, ten: h.ten, dv: h.don_vi, dm: h.danh_muc && h.danh_muc.ten, ton: h.ton_kho, gia: [], ngung: true, _t: boDau(h.ten + ' ' + h.id) }));
    ds = S.hNgung;
  } else if (S.hLoc === 'saphet') {
    const r = await api('v_hang_sap_het?select=id,ton_toi_thieu');
    const min = {}; r.forEach(x => min[x.id] = x.ton_toi_thieu);
    ds = S.hang.filter(h => h.id in min).map(h => Object.assign({}, h, { min: min[h.id] }));
  } else ds = LOC_HANG[S.hLoc][1] ? S.hang.filter(LOC_HANG[S.hLoc][1]) : S.hang;
  if (S.hDm) ds = ds.filter(h => h.dm === S.hDm);
  const tu = boDau(S.hTim).split(/\s+/).filter(Boolean);
  if (tu.length) ds = ds.filter(h => tu.every(t => h._t.includes(t)));
  return ds;
}

async function layHang(id) {
  const r = await api('hang_hoa?select=*,danh_muc(ten),ncc_hang(nha_cung_cap(id,ten,sdt,nguoi_lien_he,sdt_nv)),bang_gia(quy_cach,so_luong_quy_doi,gia_ban,dang_ap_dung,sua_luc)&id=eq.' + id);
  if (!r[0]) throw new Error('Không tìm thấy mặt hàng ' + id);
  const h = r[0];
  h.gia = h.bang_gia.filter(g => g.dang_ap_dung).sort((a, b) => a.so_luong_quy_doi - b.so_luong_quy_doi);
  return h;

function tonTheoQC(h) {

}

    { k: 'anh', nhan: 'Ảnh chuyển khoản / biên nhận', kieu: 'anh' },
    { k: 'gc', nhan: 'Ghi chú', goiY: 'VD: trả toa ngày 20/10' },
  ], 'Ghi nhận', no > 0 ? 'Đang nợ ' + tien(no) : '');
  if (!v || v.tien <= 0) return;
  if (v.tien < 10000 && !await xacNhan('Trả chỉ ' + tien(v.tien) + '? Muốn 1.000.000đ thì gõ 1000k hoặc 1tr.', 'Đúng ' + tien(v.tien))) return;
  await cho('Đang lưu…', async () => {
    const anh = await taiNhieuAnh(v.anh, 'ck-ncc/' + n.id);
    await rpc('tra_no_ncc', { p: { ncc_id: n.id, so_tien: v.tien, hinh_thuc: v.ht, ghi_chu: v.gc, anh } });
  });
  thongBao('Đã ghi trả ' + tien(v.tien), 'tot'); await taiLaiNcc();
};
HD.toaHuy = async el => {
  if (!await xacNhan('Huỷ toa ' + el.dataset.id + '? Khoản trả kèm toa (nếu có) cũng bị xoá, nợ NCC tính lại.', 'Huỷ toa')) return;
  await rpc('huy_phieu_nhap', { p_id: el.dataset.id }); thongBao('Đã huỷ toa', 'tot'); await taiLaiNcc();
};
HD.nccTraHuy = async el => {
  if (!await xacNhan('Huỷ khoản trả này? (dùng khi ghi nhầm)', 'Huỷ')) return;
  await rpc('huy_tra_ncc', { p_id: Number(el.dataset.id) }); thongBao('Đã huỷ', 'tot'); await taiLaiNcc();
};

// Thêm / sửa nhà cung cấp (chỉ chủ)
async function formNcc(n) {
  n = n || { dang_hop_tac: true };
  const v = await hoi(n.id ? 'Sửa ' + n.ten : 'Thêm nhà cung cấp', [
    { k: 'ten', nhan: 'Tên nhà cung cấp', gt: n.ten, goiY: 'VD: NPP Vinamilk Hoà Khánh' },
    { k: 'dia_chi', nhan: 'Địa chỉ', gt: n.dia_chi },
    { k: 'sdt', nhan: 'SĐT nhà cung cấp', kieu: 'sdt', gt: n.sdt },
    { k: 'nguoi_lien_he', nhan: 'Nhân viên bán hàng (sale)', gt: n.nguoi_lien_he, goiY: 'VD: anh Tuấn' },
    { k: 'sdt_nv', nhan: 'SĐT nhân viên bán hàng', kieu: 'sdt', gt: n.sdt_nv },
    { k: 'lich_giao', nhan: 'Lịch giao / ghé đơn', gt: n.lich_giao, goiY: 'VD: Thứ 2, Thứ 5' },
    { k: 'ghi_chu', nhan: 'Ghi chú', gt: n.ghi_chu, goiY: 'VD: đặt trước 10h, nợ gối 1 lần' },
    { k: 'dang_hop_tac', nhan: 'Đang lấy hàng của NCC này', kieu: 'hop', gt: n.dang_hop_tac },
  ], n.id ? 'Lưu' : 'Thêm');
  if (!v) return null;
  if (!v.ten) { thongBao('Chưa nhập tên nhà cung cấp', 'loi'); return null; }
  const trung = (S.ncc || []).find(x => x.id !== n.id && boDau(x.ten) === boDau(v.ten));
  if (trung && !await xacNhan('Đã có nhà cung cấp "' + trung.ten + '". Vẫn lưu?', 'Vẫn lưu')) return null;
  const dl = {}; ['ten', 'dia_chi', 'sdt', 'nguoi_lien_he', 'sdt_nv', 'lich_giao', 'ghi_chu'].forEach(k => dl[k] = v[k] || null);
  dl.dang_hop_tac = v.dang_hop_tac;
  const r = n.id ? await sua('nha_cung_cap', 'id=eq.' + n.id, dl) : await ghi('nha_cung_cap', dl);
  thongBao('Đã lưu nhà cung cấp', 'tot'); await taiNcc(); return r[0];
}
HD.nccThem = async () => {
  const r = await formNcc(); if (!r) return;
  veBang(); await HD.nccMo({ dataset: { id: r.id } });
  if (await xacNhan('Gán luôn các mặt hàng ' + r.ten + ' bỏ?', 'Gán mặt hàng')) HD.nccThemHang();
};
HD.nccSua = async () => { if (await formNcc(nccDangMo())) await taiLaiNcc(); };
// Gán mặt hàng: gõ tìm → bấm vào món để gán / bỏ (✓ = đã gán). Gán nhiều món liên tục không cần đóng.
HD.nccThemHang = () => {
  const n = nccDangMo(); S.nccChon = new Set(n.hang.map(h => h.id)); S.timNccHang = '';
  moBang('Gán hàng cho ' + n.ten, () => `<p class="mo">Gõ tên hàng, bấm vào món để gán. Bấm lần nữa để bỏ.</p>
    <input class="o" id="o-tim-ncc-hang" data-i="timNccHang" placeholder="Tìm hàng… (vd: fami, tiger)" value="${esc(S.timNccHang)}" autocomplete="off">
    <div id="kq-ncc-hang">${veKqNccHang()}</div>
    <button class="nut chinh" style="width:100%;margin-top:10px" data-a="dongBang">Xong</button>`, () => taiLaiNcc().catch(() => {}));
  setTimeout(() => { const o = $('#o-tim-ncc-hang'); if (o) o.focus(); }, 60);
};
function veKqNccHang() {
  const q = S.timNccHang.trim();
  const ds = q ? loc(q) : S.hang.filter(h => S.nccChon.has(h.id));
  return `<div class="the ds" style="margin-top:8px">${ds.map(h => { const co = S.nccChon.has(h.id);
    return `<div class="muc dong" data-a="nccBatHang" data-id="${h.id}"><span class="gian">${co ? '✅' : '⬜'} ${esc(h.ten)}<br>
      <span class="mo">${esc(h.dv)}${h.dm ? ' · ' + esc(h.dm) : ''}</span></span></div>`; }).join('')
    || `<div class="trong">${q ? 'Không thấy "' + esc(q) + '"' : 'Chưa gán món nào'}</div>`}</div>`;
}
GO.timNccHang = el => { S.timNccHang = el.value; $('#kq-ncc-hang').innerHTML = veKqNccHang(); };
HD.nccBatHang = async el => {
  const n = nccDangMoDuoi(), id = el.dataset.id;
  if (S.nccChon.has(id)) { await api('ncc_hang?ncc_id=eq.' + n.id + '&hang_hoa_id=eq.' + id, { method: 'DELETE' }); S.nccChon.delete(id); }
  else { await ghi('ncc_hang', { ncc_id: n.id, hang_hoa_id: id }); S.nccChon.add(id); }
  $('#kq-ncc-hang').innerHTML = veKqNccHang();
};
// Bảng "gán hàng" nằm trên bảng chi tiết NCC → NCC đang mở là bảng ngay bên dưới
const nccDangMoDuoi = () => S.bangs[S.bangs.length - 2].nx;
HD.nccBoHang = async el => {
  const n = nccDangMo(), h = n.hang.find(x => x.id === el.dataset.id);
  if (!await xacNhan('Bỏ "' + h.ten + '" khỏi ' + n.ten + '?', 'Bỏ')) return;
  await api('ncc_hang?ncc_id=eq.' + n.id + '&hang_hoa_id=eq.' + h.id, { method: 'DELETE' });
  thongBao('Đã bỏ ' + h.ten, 'tot'); await taiLaiNcc();
};
// Tin nhắn đặt hàng gửi nhân viên bán hàng qua Zalo: món sắp hết lên trước, để trống số lượng cho mình điền
HD.nccCopyDat = () => {
  const n = nccDangMo(), shop = (S.cauHinh.cua_hang || {}).ten || 'cửa hàng';
  const het = n.hang.filter(h => h.dang_ban && sapHet(h)), con = n.hang.filter(h => h.dang_ban && !sapHet(h));
  const ds = het.length ? het.map(h => '- ' + h.ten + ': ... (còn ' + so(h.ton_kho) + ' ' + h.don_vi + ')') : con.map(h => '- ' + h.ten + ': ...');
  copy('Chào ' + (n.nguoi_lien_he || 'anh/chị') + ', ' + shop + ' đặt hàng:\n' + ds.join('\n') + '\nCảm ơn!');
};
// Từ chi tiết hàng: gán món này cho 1 NCC
HD.nccGanChoHang = async () => {
  const h = hangDangXem(); if (!S.ncc) await taiNcc();
  const co = new Set((h.ncc_hang || []).map(l => l.nha_cung_cap && l.nha_cung_cap.id));
  const ds = S.ncc.filter(n => n.dang_hop_tac && !co.has(n.id));
  if (!ds.length) return thongBao(S.ncc.length ? 'Món này đã gán hết các NCC' : 'Chưa có NCC – thêm ở Thêm → Nhà cung cấp', 'loi');
  const v = await hoi('Gán NCC cho ' + h.ten, [{ k: 'id', nhan: 'Nhà cung cấp', kieu: 'chon', ds: ds.map(n => [n.id, n.ten + (n.nguoi_lien_he ? ' – ' + n.nguoi_lien_he : '')]), gt: ds[0].id }], 'Gán');
  if (!v) return;
  await ghi('ncc_hang', { ncc_id: v.id, hang_hoa_id: h.id }); thongBao('Đã gán', 'tot'); await taiLaiHangDangXem(); taiNcc().catch(() => {});
};

// ── 11. ĐĂNG NHẬP & KHỞI ĐỘNG ────────────────────────────────────────
function veDangNhap(loi) {
  $('#goc').innerHTML = `<form class="dang-nhap" id="form-dn"><h1>🛒 Bán hàng</h1><p class="mo">Đăng nhập để bắt đầu</p>
    <label class="nhan">Tên đăng nhập hoặc email</label><input class="o" name="email" autocomplete="username" autocapitalize="off" value="${esc(doc('bh_email_cu') || '')}">
    <label class="nhan">Mật khẩu</label><input class="o" name="mk" type="password" autocomplete="current-password">
    <button class="nut chinh" style="width:100%;margin-top:16px;padding:13px">Đăng nhập</button>
    <p class="no" id="loi-dn">${esc(loi || '')}</p></form>`;
  $('#form-dn').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target; let email = f.email.value.trim().toLowerCase();
    if (email && !email.includes('@')) email += CFG.duoiEmail;
    try {
      await chay(f.querySelector('button'), 'Đang vào…', async () => {
        datPhien(await goiAuth('token?grant_type=password', { email, password: f.mk.value }));
        luu('bh_email_cu', f.email.value.trim());
        await vaoApp();
      });
    } catch (e) { $('#loi-dn').textContent = e.message; }
  };
}
function veChoDuyet() {
  $('#goc').innerHTML = `<div class="dang-nhap"><h1>⏳ Chờ duyệt</h1><p>Tài khoản <b>${esc(phien.user.email)}</b> đã tạo nhưng chưa được chủ cửa hàng duyệt (hoặc đã bị khoá).</p>
    <p class="mo">Nhờ chủ vào Thêm → Nhân viên → bấm Duyệt.</p>
    <div class="hang-nut"><button class="nut chinh" data-a="kiemTraLai">Kiểm tra lại</button><button class="nut" data-a="dangXuatNgay">Đăng xuất</button></div></div>`;
}
HD.kiemTraLai = () => vaoApp();
HD.dangXuatNgay = () => dangXuat();

// Sau khi có phiên: biết mình là ai → tải dữ liệu → vẽ app
async function vaoApp() {
  const nv = await api('nhan_vien?select=*&id=eq.' + phien.user.id);
  S.toi = nv[0] || null; luu('bh_toi', S.toi);
  if (!S.toi || !S.toi.hoat_dong) return veChoDuyet();
  await Promise.all([taiCauHinh(), taiKhach(), S.hang.length ? Promise.resolve() : taiHang(true)]);
  veKhung();
  if (Date.now() - S.hangLuc > 60e3) taiHang(true).catch(() => {});
}
async function khoiDong() {
  // Xin trình duyệt đừng tự xoá bộ nhớ của app (giỏ hàng, phiên đăng nhập)
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  chuanBiHang(); S.khach.forEach(k => { k._t = boDau(k.ten) + ' ' + chiSo(k.sdt) + ' ' + k.id.toLowerCase(); });
  if (!phien) return veDangNhap();
  // Đã đăng nhập trước đó: vẽ ngay bằng dữ liệu lưu trên máy, rồi cập nhật ngầm
  if (S.toi && S.toi.hoat_dong) veKhung();
  try { await vaoApp(); }
  catch (e) { if (!phien) return; if (S.toi && S.toi.hoat_dong) thongBao(e.message + ' – đang dùng dữ liệu lưu trên máy', 'loi'); else veDangNhap(e.message); }
}
// Quay lại app sau khi để lâu → tự tải lại hàng
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.toi && Date.now() - S.hangLuc > CFG.phutLamMoiHang * 60e3) taiHang(true).catch(() => {});
});
window.__appChay = true;   // dấu hiệu: mã app đã chạy hết (không bị dán thiếu)
khoiDong();
</script>
